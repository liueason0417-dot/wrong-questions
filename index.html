<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測錯題數據庫 - 互動訂正版</title>
    <!-- 引入 Firebase v10 Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
    <!-- 引入 html2pdf.js 用於直接下載 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* --- 現代化暗色主題色票 --- */
        :root {
            --bg-color: #0f172a;       /* Slate 900 */
            --card-bg: #1e293b;        /* Slate 800 */
            --text-main: #f8fafc;      /* Slate 50 */
            --text-muted: #94a3b8;     /* Slate 400 */
            --accent-color: #6366f1;   /* Indigo 500 */
            --accent-hover: #4f46e5;   /* Indigo 600 */
            --border-color: #334155;   /* Slate 700 */
            --danger-color: #ef4444;   /* Red 500 */
            --warning-color: #f59e0b;  /* Amber 500 */
            --success-color: #10b981;  /* Emerald 500 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0;
        }

        /* --- 頂部導航列 --- */
        .navbar {
            background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; padding: 12px 20px;
        }
        .nav-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
        .nav-brand { font-size: 20px; font-weight: 700; margin: 0; white-space: nowrap; }
        
        .search-bar { flex-grow: 1; max-width: 400px; position: relative; }
        .search-bar input {
            width: 100%; padding: 10px 15px 10px 35px; border-radius: 20px; border: 1px solid var(--border-color);
            background-color: rgba(255,255,255,0.05); color: var(--text-main); font-size: 14px; box-sizing: border-box; transition: all 0.2s;
        }
        .search-bar input:focus { outline: none; border-color: var(--accent-color); background-color: rgba(255,255,255,0.1); }
        .search-bar::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.7; }

        .nav-actions { display: flex; gap: 10px; }
        .btn-nav { padding: 8px 16px; font-size: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: rgba(255,255,255,0.1); color: var(--text-main); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.15); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

        /* --- 控制面板 (篩選) --- */
        .control-panel { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px; margin-bottom: 25px; }
        .filter-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .filter-group select {
            flex: 1; min-width: 140px; padding: 10px 12px; background-color: #0f172a; border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-main); font-size: 14px; cursor: pointer;
        }

        .chart-section { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; display: none; }
        .chart-section.active { display: block; }
        .btn-toggle-chart { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; margin-top: 10px; }
        .btn-toggle-chart:hover { color: var(--text-main); }

        /* --- 錯題卡片網格 --- */
        .questions-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding-bottom: 100px; }
        .question-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column; transition: all 0.2s ease; cursor: pointer; position: relative; user-select: none;
        }
        .question-card:hover { border-color: #475569; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .question-card.selected { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }

        .card-checkbox {
            position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; background-color: rgba(15, 23, 42, 0.7);
            border: 2px solid #94a3b8; border-radius: 6px; z-index: 10; opacity: 0; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .question-card:hover .card-checkbox, .question-card.selected .card-checkbox { opacity: 1; }
        .question-card.selected .card-checkbox { background-color: var(--accent-color); border-color: var(--accent-color); }
        .question-card.selected .card-checkbox::after { content: "✓"; color: white; font-size: 14px; font-weight: bold; }

        .question-img-container { width: 100%; height: 150px; background-color: #000; position: relative; }
        .question-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: opacity 0.2s; }
        .question-card:hover .question-img { opacity: 1; }

        .tag-subject-absolute {
            position: absolute; top: 10px; right: 10px; background-color: rgba(15, 23, 42, 0.8); color: white;
            padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
        }

        .question-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* 自訂標籤 (Tags) 樣式 */
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .custom-tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .tag-remove-btn { margin-left: 4px; cursor: pointer; opacity: 0.6; font-size: 10px; }
        .tag-remove-btn:hover { opacity: 1; }

        .concept-text { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; line-height: 1.3; }
        .unit-text { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        
        .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border-color); }
        .btn-toggle-exp { background: none; color: var(--accent-color); border: none; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }
        .btn-toggle-exp:hover { text-decoration: underline; }
        .explanation-img-box { display: none; margin-top: 10px; background-color: #000; border-radius: 6px; overflow: hidden; }

        /* --- 批量操作浮動工具列 --- */
        .batch-floating-bar {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background-color: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px); z-index: 1500; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; width: 90%; max-width: 700px;
        }
        .batch-floating-bar.active { bottom: 30px; pointer-events: auto; }
        .batch-left { display: flex; align-items: center; gap: 12px; }
        .batch-count-text { font-size: 14px; color: var(--text-main); font-weight: 600; }
        .batch-count-num { color: var(--warning-color); font-size: 16px; }
        .btn-batch-cancel { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; }
        .batch-right { display: flex; gap: 8px; flex-wrap: wrap; }
        .batch-right button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }

        /* --- 圖片檢視器 Modal --- */
        .viewer-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px); }
        .viewer-content { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
        
        .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 2200; background: transparent; }
        .viewer-tools { display: flex; gap: 8px; align-items: center; }
        .viewer-tools button { background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; transition: background 0.2s; }
        .viewer-tools button:hover { background: rgba(255,255,255,0.2); }
        .viewer-tools button.active { background: var(--accent-color); }
        .close-viewer { color: #fff; font-size: 28px; cursor: pointer; }
        
        /* 側邊浮動畫筆工具列 */
        .draw-tools-floating {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px;
            display: none; flex-direction: column; gap: 15px; z-index: 2200; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .tool-group { display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; align-items: center; }
        .tool-group:last-child { border-bottom: none; padding-bottom: 0; }
        .tool-btn { width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent; color: white; font-size: 16px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
        .tool-btn:hover { background: rgba(255,255,255,0.1); }
        .tool-btn.active { background: var(--accent-color); }
        .draw-tools-floating input[type="color"] { width: 28px; height: 28px; padding: 0; border: none; border-radius: 50%; cursor: pointer; background: none; }
        .draw-tools-floating input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .draw-tools-floating input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 50%; }

        .viewer-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(255,255,255,0.1); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 2100; }
        .viewer-prev-btn { left: 20px; } .viewer-next-btn { right: 20px; }
        
        /* 圖片與畫布容器 */
        .viewer-img-container { flex-grow: 1; overflow: auto; text-align: center; padding: 20px; display: flex; align-items: center; justify-content: center; position: relative; }
        .image-wrapper { position: relative; display: inline-block; }
        #viewerImage { display: block; max-width: 90vw; max-height: 85vh; width: auto; height: auto; opacity: 0.5; border-radius: 8px; transition: transform 0.2s ease-out; }
        #annotationCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 3; cursor: crosshair; touch-action: none; border-radius: 8px; transition: transform 0.2s ease-out; }

        /* 浮動輕量化資訊欄 */
        .viewer-metadata-floating {
            position: absolute; bottom: 20px; right: 20px; width: 320px;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px;
            z-index: 2200; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: opacity 0.3s;
        }
        .btn-toggle-meta {
            position: absolute; bottom: 20px; right: 20px; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1); color: white; padding: 8px 16px; border-radius: 20px; z-index: 2201; cursor: pointer; display: none;
        }
        
        .viewer-action-line { display: flex; gap: 10px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; flex-wrap: wrap; align-items: center; }
        .viewer-action-line button { border: none; border-radius: 6px; cursor: pointer; padding: 6px 12px; font-size: 12px; font-weight: 600; transition: background 0.2s; }
        .viewer-btn-review { background-color: rgba(255,255,255,0.1); color: var(--text-main); }
        .viewer-btn-review:hover { background-color: rgba(255,255,255,0.15); }
        .viewer-btn-delete { background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color) !important; margin-left: auto; }
        
        .add-tag-container { display: flex; gap: 5px; margin-top: 10px; }
        .add-tag-container input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
        .add-tag-container button { background: var(--accent-color); color: white; border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }

        /* --- 共用 Modal 樣式 --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.85); overflow-y: auto; backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--bg-color); margin: 40px auto; padding: 25px; border: 1px solid var(--border-color); width: 95%; max-width: 900px; border-radius: 16px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 20px; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        
        .prompt-box, .import-box { background-color: var(--card-bg); border: 1px dashed var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .prompt-box textarea, .import-box textarea { width: 100%; background: #0f172a; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px; border-radius:6px; }
        .upload-trigger { display: block; width: 100%; background: rgba(99, 102, 241, 0.05); border: 2px dashed var(--accent-color); padding: 30px 10px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        .upload-trigger input { display: none; }
        .queue-item { display: flex; gap: 15px; background: var(--card-bg); padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 15px; }
        .queue-img-wrap { width: 200px; flex-shrink: 0; }
        .queue-img-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .queue-inputs { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .queue-inputs textarea, .queue-inputs input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; }
        
        .setting-group { margin-bottom: 15px; }
        .setting-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .setting-group select, .setting-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- 頂部導航列 -->
<nav class="navbar">
    <div class="nav-content">
        <h1 class="nav-brand">學測錯題數據庫</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜尋觀念、單元或備註..." oninput="handleSearch()">
        </div>
        <div class="nav-actions">
            <button class="btn-nav btn-secondary" onclick="openRandomModal()">🎲 隨機特訓</button>
            <button class="btn-nav btn-primary" onclick="openModal()">＋ 新增錯題</button>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="filter-group">
            <select id="filterSubject" onchange="renderQuestions()">
                <option value="全部">📚 全部科目</option>
                <option value="國文">國文</option>
                <option value="英文">英文</option>
                <option value="數學">數學</option>
                <option value="物理">物理</option>
                <option value="化學">化學</option>
                <option value="生物">生物</option>
                <option value="地科">地科</option>
                <option value="歷史">歷史</option>
                <option value="地理">地理</option>
                <option value="公民">公民</option>
            </select>
            <!-- 標籤篩選器 -->
            <select id="filterTag" onchange="renderQuestions()">
                <option value="全部">🏷️ 所有標籤</option>
            </select>
            <select id="sortOrder" onchange="renderQuestions()">
                <option value="newest">⏱️ 最新加入優先</option>
                <option value="oldest">⏱️ 最舊加入優先</option>
                <option value="reviewAsc">🔄 複習次數：少到多</option>
            </select>
        </div>
        
        <button class="btn-toggle-chart" onclick="toggleChartSection()">📊 顯示圖表 ▼</button>
        <div class="chart-section" id="chartSection">
            <div class="chart-container" id="chartContainer" style="width: 100%;">
                <canvas id="weaknessChart" style="display: block; width: 100%;"></canvas>
            </div>
        </div>
    </div>

    <!-- 錯題列表 -->
    <div class="questions-list" id="questionsList"></div>
</div>

<!-- 隨機特訓設定 Modal -->
<div id="randomModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <span class="close-modal" onclick="closeRandomModal()">&times;</span>
        <h2 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:15px;">🎲 隨機特訓設定</h2>
        <div class="setting-group">
            <label>選擇要測驗的科目：</label>
            <select id="randomSubject">
                <option value="全部">📚 全部科目 (混考)</option>
                <option value="國文">國文</option>
                <option value="英文">英文</option>
                <option value="數學">數學</option>
                <option value="物理">物理</option>
                <option value="化學">化學</option>
                <option value="生物">生物</option>
                <option value="地科">地科</option>
                <option value="歷史">歷史</option>
                <option value="地理">地理</option>
                <option value="公民">公民</option>
            </select>
        </div>
        <div class="setting-group">
            <label>抽題數量：</label>
            <input type="number" id="randomCount" value="20" min="1">
        </div>
        <button class="btn-nav btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:10px;" onclick="executeRandomQuiz()">開始抽題</button>
    </div>
</div>

<!-- 批次新增錯題 Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:15px;">批次新增錯題</h2>
        <div class="prompt-box">
            <label style="color:var(--success-color); font-weight:bold;">1. 獲取專屬 AI 指令</label>
            <textarea id="aiPromptText" rows="3" readonly></textarea>
            <button class="btn-nav btn-secondary" style="width:100%; justify-content:center; margin-top:10px;" onclick="copyPrompt()">📋 一鍵複製指令給 AI</button>
        </div>
        <label class="upload-trigger">
            <span style="font-size:16px; font-weight: 600; color:var(--text-main);">📁 點擊選取題目照片 (支援多選)</span>
            <input type="file" id="multiPhotoInput" accept="image/*" multiple onchange="handleFilesSelect(event)">
        </label>
        <div class="import-box" id="masterImportSection" style="display:none;">
            <label style="color:var(--success-color); font-weight:bold;">3. 貼入所有照片的 AI 解析</label>
            <textarea id="masterAiImport" rows="5" oninput="distributeMasterAi()"></textarea>
        </div>
        <div id="queueContainer"></div>
        <button id="submitAllBtn" class="btn-nav btn-primary" style="display:none; width:100%; justify-content:center; padding:15px; font-size:16px;" onclick="saveAllQuestions()">全部儲存並上傳</button>
    </div>
</div>

<!-- 圖片檢視器 Modal (含畫筆與浮動資訊欄) -->
<div id="imageViewerModal" class="viewer-modal">
    <button class="viewer-nav-btn viewer-prev-btn" id="viewerPrevBtn" onclick="navigateViewer(-1)">＜</button>
    <button class="viewer-nav-btn viewer-next-btn" id="viewerNextBtn" onclick="navigateViewer(1)">＞</button>
    
    <!-- 側邊浮動畫筆工具列 -->
    <div class="draw-tools-floating" id="drawTools">
        <div class="tool-group">
            <button class="tool-btn active" data-tool="free" onclick="setTool('free')" title="自由畫筆">✏️</button>
            <button class="tool-btn" data-tool="line" onclick="setTool('line')" title="直線">📏</button>
            <button class="tool-btn" data-tool="rect" onclick="setTool('rect')" title="矩形框">⬜</button>
        </div>
        <div class="tool-group">
            <input type="color" id="brushColor" value="#ef4444" title="顏色">
            <input type="range" id="brushSize" min="1" max="15" value="3" title="粗細" style="width: 40px; margin-top: 5px;">
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-tool="eraser" onclick="setTool('eraser')" title="一般橡皮擦">🧽</button>
            <button class="tool-btn" data-tool="strokeEraser" onclick="setTool('strokeEraser')" title="筆跡消除 (點擊整條刪除)">🪄</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" onclick="undo()" title="上一步 (Ctrl+Z)">↩️</button>
            <button class="tool-btn" onclick="clearCanvas()" title="全部清空">🗑️</button>
            <button class="tool-btn" onclick="saveAnnotation()" title="儲存筆跡" style="color: var(--success-color);">💾</button>
        </div>
    </div>

    <div class="viewer-content">
        <div class="viewer-header">
            <div class="viewer-tools">
                <button onclick="zoomImage(0.3)">放大 ＋</button>
                <button onclick="zoomImage(-0.3)">縮小 －</button>
                <button onclick="resetZoom()">重設</button>
                <button id="btnToggleDraw" onclick="toggleAnnotationMode()" style="margin-left: 15px; background: var(--accent-color);">✏️ 標註/訂正</button>
            </div>
            <span class="close-viewer" onclick="closeImageViewer()">&times;</span>
        </div>
        
        <div class="viewer-img-container" id="viewerImgContainer">
            <div class="image-wrapper" id="imageWrapper">
                <img id="viewerImage" src="" alt="放大圖片">
                <canvas id="annotationCanvas"></canvas>
            </div>
        </div>
        
        <!-- 浮動輕量化資訊欄 -->
        <div class="viewer-metadata-floating" id="viewerMetadata">
            <!-- 內容由 JS 動態生成 -->
        </div>
        <button class="btn-toggle-meta" id="btnToggleMeta" onclick="toggleMetadata()">ℹ️ 顯示資訊</button>
    </div>
</div>

<!-- 批量操作浮動工具列 -->
<div class="batch-floating-bar" id="batchFloatingBar">
    <div class="batch-left">
        <span class="batch-count-text">已選取 <span id="batchSelectCount" class="batch-count-num">0</span> 題</span>
        <button class="btn-batch-cancel" onclick="cancelSelection()">取消選取</button>
    </div>
    <div class="batch-right">
        <button class="btn-nav btn-primary" onclick="batchExportSmartPDF()">🖨️ 智慧列印 (附詳解與筆跡)</button>
        <button class="btn-nav btn-secondary" onclick="batchExportWord()">📄 匯出 Word</button>
        <button class="btn-nav btn-secondary" style="color:var(--danger-color); border:1px solid var(--danger-color);" onclick="batchDelete()">🗑️ 刪除</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA5xWtkaPt0_5doRo55WLIbBroI22ypkZ8",
        authDomain: "ai-vocab-coach.firebaseapp.com",
        projectId: "ai-vocab-coach",
        storageBucket: "ai-vocab-coach.firebasestorage.app",
        messagingSenderId: "550257355969",
        appId: "1:550257355969:web:79e07e09c977e861163840"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let unsubscribe = null;
    window.currentItemsMap = {}; 
    let allItemsArray = []; 
    let filteredSortedItems = []; 
    let selectedFilesQueue = [];
    
    let searchQuery = "";
    let currentViewerId = null;
    let currentZoom = 1;
    let selectedCardIds = new Set();
    let lastSelectedId = null;
    let pressTimer;
    let chartExpanded = false;

    // 標籤顏色分配器
    const tagColors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
    function getTagColor(tag) {
        let hash = 0;
        for (let i = 0; i < tag.length; i++) hash = tag.charCodeAt(i) + ((hash << 5) - hash);
        return tagColors[Math.abs(hash) % tagColors.length];
    }

    window.onload = function() {
        loadQuestions();
        setupSwipeGestures();
        setupCanvas();
        window.addEventListener("resize", function() {
            if(document.getElementById("chartSection").classList.contains("active")) triggerChartRebuilt();
        });
    };

    function loadQuestions() {
        if (unsubscribe) unsubscribe();
        unsubscribe = db.collection("questions").onSnapshot((snapshot) => {
            allItemsArray = [];
            let allTags = new Set();

            snapshot.forEach(doc => {
                const item = doc.data();
                item.id = doc.id;
                if (typeof item.reviewCount === 'undefined') item.reviewCount = 0;
                if (!item.tags) item.tags = []; 
                
                item.tags.forEach(t => allTags.add(t));
                allItemsArray.push(item);
                window.currentItemsMap[item.id] = item;
            });
            
            updateTagFilterDropdown(Array.from(allTags));
            updateAIPrompt(allItemsArray);
            renderQuestions();
        }, (error) => { console.error("雲端讀取失敗:", error); });
    }

    function updateTagFilterDropdown(tags) {
        const select = document.getElementById("filterTag");
        const currentVal = select.value;
        select.innerHTML = `<option value="全部">🏷️ 所有標籤</option>`;
        tags.sort().forEach(tag => {
            select.innerHTML += `<option value="${tag}">${tag}</option>`;
        });
        if (tags.includes(currentVal)) select.value = currentVal;
    }

    function handleSearch() {
        searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
        renderQuestions();
    }

    function renderQuestions() {
        const filterSub = document.getElementById("filterSubject").value;
        const filterTag = document.getElementById("filterTag").value;
        const sortOrder = document.getElementById("sortOrder").value;

        filteredSortedItems = allItemsArray.filter(item => {
            if (filterSub !== "全部" && item.subject !== filterSub) return false;
            if (filterTag !== "全部" && !item.tags.includes(filterTag)) return false;
            if (searchQuery) {
                const textToSearch = `${item.subject} ${item.unit} ${item.concept} ${item.notes || ''} ${(item.tags||[]).join(' ')}`.toLowerCase();
                if (!textToSearch.includes(searchQuery)) return false;
            }
            return true;
        });

        filteredSortedItems.sort((a, b) => {
            if (sortOrder === "newest") return b.timestamp - a.timestamp;
            if (sortOrder === "oldest") return a.timestamp - b.timestamp;
            if (sortOrder === "reviewAsc") return a.reviewCount - b.reviewCount;
            return 0;
        });

        const listContainer = document.getElementById("questionsList");
        listContainer.innerHTML = "";

        if (filteredSortedItems.length === 0) {
            listContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--text-muted);">沒有符合條件的題目</div>`;
        } else {
            filteredSortedItems.forEach(item => {
                const hasExplanation = item.hasExplanation || (item.explanationImage && item.explanationImage.trim().length > 0);
                const displayImgSrc = item.thumbnail || item.image || "";
                
                let tagsHtml = "";
                if (item.tags && item.tags.length > 0) {
                    tagsHtml = `<div class="tags-container">` + 
                        item.tags.map(t => {
                            const color = getTagColor(t);
                            return `<span class="custom-tag" style="background-color: ${color}20; color: ${color}; border: 1px solid ${color}40;">🏷️ ${t}</span>`;
                        }).join('') + `</div>`;
                }

                const card = document.createElement("div");
                card.className = "question-card";
                card.setAttribute("data-id", item.id);
                
                card.addEventListener("click", (e) => handleCardClick(e, item.id));
                card.addEventListener("touchstart", () => handleTouchStart(item.id), { passive: true });
                card.addEventListener("touchend", handleTouchCancel, { passive: true });

                card.innerHTML = `
                    <div class="card-checkbox"></div>
                    <div class="question-img-container">
                        <span class="tag-subject-absolute">${item.subject}</span>
                        <img class="question-img" src="${displayImgSrc}" alt="錯題縮圖">
                    </div>
                    <div class="question-details">
                        ${tagsHtml}
                        <div class="concept-text">${item.concept}</div>
                        <div class="unit-text">${item.unit}</div>
                        
                        <div class="card-footer">
                            <span style="font-size:12px; color:var(--text-muted);">🔄 複習 ${item.reviewCount} 次</span>
                            ${hasExplanation ? `<button class="btn-toggle-exp" id="btn-exp-${item.id}" onclick="toggleExplanation(event, '${item.id}')">看詳解</button>` : ''}
                        </div>
                        <div class="explanation-img-box" id="exp-${item.id}"></div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        if(document.getElementById("chartSection").classList.contains("active")) triggerChartRebuilt();
        updateSelectionUI();
    }

    /* --- 圖片檢視器與浮動資訊欄 --- */
    let isMetaVisible = true;
    function toggleMetadata() {
        isMetaVisible = !isMetaVisible;
        const metaPanel = document.getElementById("viewerMetadata");
        const toggleBtn = document.getElementById("btnToggleMeta");
        if (isMetaVisible) {
            metaPanel.style.display = "block";
            toggleBtn.style.display = "none";
        } else {
            metaPanel.style.display = "none";
            toggleBtn.style.display = "block";
        }
    }

    async function openImageViewer(id) {
        currentViewerId = id; 
        resetZoom();
        cancelAnnotation(); 
        
        const item = window.currentItemsMap[id];
        if (!item) return;
        
        const viewerImg = document.getElementById("viewerImage");
        viewerImg.src = item.thumbnail || item.image || ""; 
        viewerImg.style.opacity = "0.5";

        renderViewerMetadata(id); 
        document.getElementById("imageViewerModal").style.display = "block";

        if (!item.fullImageLoaded && !item.image) {
            try {
                const imgDoc = await db.collection("question_images").doc(id).get();
                if (imgDoc.exists) {
                    item.fullImage = imgDoc.data().image; 
                    item.fullExplanationImage = imgDoc.data().explanationImage; 
                    item.annotationImage = imgDoc.data().annotationImage || ""; 
                    item.fullImageLoaded = true;
                }
            } catch(err) { console.error("抓取圖片失敗", err); }
        }

        if (currentViewerId === id) { 
            viewerImg.src = item.fullImage || item.image || viewerImg.src; 
            viewerImg.style.opacity = "1"; 
            
            // 載入塗鴉層到 Canvas
            if (item.annotationImage) {
                loadBaseAnnotation(item.annotationImage);
            } else {
                baseAnnotationImg = null;
                drawHistory = [];
                redrawCanvas();
            }
        }
    }

    function renderViewerMetadata(id) {
        const item = window.currentItemsMap[id];
        const dateStr = new Date(item.timestamp).toLocaleDateString('zh-TW');
        
        let tagsHtml = (item.tags || []).map(t => {
            const color = getTagColor(t);
            return `<span class="custom-tag" style="background-color: ${color}20; color: ${color}; border: 1px solid ${color}40;">
                        🏷️ ${t} <span class="tag-remove-btn" onclick="removeTag('${id}', '${t}')">✖</span>
                    </span>`;
        }).join('');

        const metaHtml = `
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <span style="background:var(--accent-color); color:white; padding:4px 8px; border-radius:6px; font-size:12px; font-weight:bold;">${item.subject}</span>
                <button onclick="toggleMetadata()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;">隱藏 🔽</button>
            </div>
            <div style="color:var(--text-main); font-size:16px; line-height:1.5;">
                <strong style="font-size:18px;">${item.concept}</strong> <span style="color:var(--text-muted); font-size: 14px; margin-left: 8px;">(${item.unit})</span>
            </div>
            ${item.notes ? `<div style="font-size: 13px; color: #cbd5e1; background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--warning-color); margin-top: 10px;"><strong>備註：</strong>${item.notes}</div>` : ''}
            
            <div style="margin-top: 15px;">
                <div class="tags-container" id="viewerTagsContainer">${tagsHtml}</div>
                <div class="add-tag-container">
                    <input type="text" id="newTagInput" placeholder="輸入新標籤..." onkeypress="if(event.key==='Enter') addTag('${id}')">
                    <button onclick="addTag('${id}')">＋ 新增</button>
                </div>
            </div>

            <div class="viewer-action-line">
                <span style="color:var(--text-muted); font-size:12px;">複習 ${item.reviewCount} 次</span>
                <button class="viewer-btn-review" onclick="viewerIncrementReview('${id}')">🔄 +1</button>
                <button class="viewer-btn-delete" onclick="viewerDeleteQuestion('${id}')">🗑️ 刪除</button>
            </div>
        `;
        document.getElementById("viewerMetadata").innerHTML = metaHtml;
    }

    async function addTag(id) {
        const input = document.getElementById("newTagInput");
        const tag = input.value.trim();
        if (!tag) return;
        
        const item = window.currentItemsMap[id];
        if (!item.tags) item.tags = [];
        if (!item.tags.includes(tag)) {
            item.tags.push(tag);
            renderViewerMetadata(id); 
            try { await db.collection("questions").doc(id).update({ tags: firebase.firestore.FieldValue.arrayUnion(tag) }); } 
            catch (err) { console.error("新增標籤失敗", err); }
        }
        input.value = "";
    }

    async function removeTag(id, tag) {
        const item = window.currentItemsMap[id];
        if (!item.tags) return;
        item.tags = item.tags.filter(t => t !== tag);
        renderViewerMetadata(id); 
        try { await db.collection("questions").doc(id).update({ tags: firebase.firestore.FieldValue.arrayRemove(tag) }); } 
        catch (err) { console.error("刪除標籤失敗", err); }
    }

    async function viewerIncrementReview(id) {
        const item = window.currentItemsMap[id];
        item.reviewCount = (item.reviewCount || 0) + 1;
        renderViewerMetadata(id);
        try { await db.collection("questions").doc(id).update({ reviewCount: item.reviewCount }); } 
        catch (err) { console.error(err); }
    }

    async function viewerDeleteQuestion(id) {
        if (!confirm("確定要刪除嗎？")) return;
        let idx = filteredSortedItems.findIndex(item => item.id === id);
        let nextId = null;
        if (filteredSortedItems.length > 1) {
            nextId = (idx < filteredSortedItems.length - 1) ? filteredSortedItems[idx + 1].id : filteredSortedItems[idx - 1].id;
        }
        try {
            await db.collection("questions").doc(id).delete();
            await db.collection("question_images").doc(id).delete(); 
            if (nextId) openImageViewer(nextId); else closeImageViewer();
        } catch (err) { alert("刪除失敗：" + err.message); }
    }

    /* --- 透明圖層畫筆系統 (Canvas Annotation) --- */
    let canvas, ctx;
    let isDrawingMode = false;
    let isDrawing = false;
    let currentTool = 'free'; // free, line, rect, eraser, strokeEraser
    let drawHistory = [];
    let currentPath = null;
    let baseAnnotationImg = null;

    function setupCanvas() {
        canvas = document.getElementById('annotationCanvas');
        ctx = canvas.getContext('2d');

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseout', endPosition);

        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });
        
        // Ctrl+Z 快捷鍵
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                if (document.getElementById("imageViewerModal").style.display === "block" && isDrawingMode) {
                    e.preventDefault(); undo();
                }
            }
        });
    }

    function loadBaseAnnotation(src) {
        baseAnnotationImg = new Image();
        baseAnnotationImg.onload = () => {
            // 確保畫布尺寸正確
            const viewerImg = document.getElementById("viewerImage");
            canvas.width = viewerImg.naturalWidth || 800;
            canvas.height = viewerImg.naturalHeight || 600;
            canvas.style.display = "block"; // 預設顯示塗鴉層
            drawHistory = [];
            redrawCanvas();
        };
        baseAnnotationImg.src = src;
    }

    function toggleAnnotationMode() {
        isDrawingMode = !isDrawingMode;
        const btn = document.getElementById("btnToggleDraw");
        const tools = document.getElementById("drawTools");
        const viewerImg = document.getElementById("viewerImage");
        
        document.getElementById("viewerPrevBtn").style.display = isDrawingMode ? "none" : "flex";
        document.getElementById("viewerNextBtn").style.display = isDrawingMode ? "none" : "flex";

        if (isDrawingMode) {
            btn.classList.add("active");
            btn.innerText = "✏️ 標註中...";
            tools.style.display = "flex";
            
            if (!canvas.width || canvas.width === 300) {
                canvas.width = viewerImg.naturalWidth || 800;
                canvas.height = viewerImg.naturalHeight || 600;
            }
            canvas.style.display = "block";
            canvas.style.pointerEvents = "auto"; // 允許點擊
            resetZoom();
            setTool('free');
        } else {
            cancelAnnotation();
        }
    }

    function cancelAnnotation() {
        isDrawingMode = false;
        document.getElementById("btnToggleDraw").classList.remove("active");
        document.getElementById("btnToggleDraw").innerText = "✏️ 標註/訂正";
        document.getElementById("drawTools").style.display = "none";
        canvas.style.pointerEvents = "none"; // 關閉點擊，只做顯示
        
        document.getElementById("viewerPrevBtn").style.display = "flex";
        document.getElementById("viewerNextBtn").style.display = "flex";
    }

    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tool-btn[data-tool="${tool}"]`).classList.add('active');
        
        if (tool === 'eraser' || tool === 'strokeEraser') canvas.style.cursor = 'cell';
        else canvas.style.cursor = 'crosshair';
    }

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let clientX = e.clientX; let clientY = e.clientY;
        if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
        return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startPosition(e) {
        if (!isDrawingMode) return;
        e.preventDefault();
        const pos = getMousePos(e);
        
        if (currentTool === 'strokeEraser') {
            eraseStrokeAt(pos.x, pos.y);
            isDrawing = true; // 允許拖曳連續消除
            return;
        }

        isDrawing = true;
        currentPath = {
            tool: currentTool,
            color: document.getElementById('brushColor').value,
            size: document.getElementById('brushSize').value * (currentTool === 'eraser' ? 3 : 1),
            points: [pos],
            start: pos,
            end: pos
        };
    }

    function endPosition() {
        if (!isDrawing || !isDrawingMode) return;
        isDrawing = false;
        if (currentTool !== 'strokeEraser' && currentPath) {
            drawHistory.push(currentPath);
            currentPath = null;
            redrawCanvas();
        }
    }

    function draw(e) {
        if (!isDrawing || !isDrawingMode) return;
        e.preventDefault();
        const pos = getMousePos(e);

        if (currentTool === 'strokeEraser') {
            eraseStrokeAt(pos.x, pos.y);
            return;
        }

        if (currentTool === 'free' || currentTool === 'eraser') {
            currentPath.points.push(pos);
        } else if (currentTool === 'line' || currentTool === 'rect') {
            currentPath.end = pos;
        }
        redrawCanvas();
    }

    function redrawCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (baseAnnotationImg) {
            ctx.globalCompositeOperation = 'source-over';
            ctx.drawImage(baseAnnotationImg, 0, 0);
        }
        for (let item of drawHistory) drawItem(item);
        if (currentPath) drawItem(currentPath);
    }

    function drawItem(item) {
        ctx.lineWidth = item.size;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        if (item.tool === 'eraser') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = item.color;
        }

        ctx.beginPath();
        if (item.tool === 'free' || item.tool === 'eraser') {
            if (item.points.length === 0) return;
            ctx.moveTo(item.points[0].x, item.points[0].y);
            for (let i = 1; i < item.points.length; i++) ctx.lineTo(item.points[i].x, item.points[i].y);
            ctx.stroke();
        } else if (item.tool === 'line') {
            ctx.moveTo(item.start.x, item.start.y); ctx.lineTo(item.end.x, item.end.y); ctx.stroke();
        } else if (item.tool === 'rect') {
            ctx.rect(item.start.x, item.start.y, item.end.x - item.start.x, item.end.y - item.start.y); ctx.stroke();
        }
    }

    // 筆跡消除數學邏輯 (點到線段距離)
    function dist2(v, w) { return Math.pow(v.x - w.x, 2) + Math.pow(v.y - w.y, 2); }
    function pointToSegmentDist(p, v, w) {
        let l2 = dist2(v, w);
        if (l2 === 0) return Math.sqrt(dist2(p, v));
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.sqrt(dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) }));
    }

    function eraseStrokeAt(x, y) {
        const threshold = 15; // 判定範圍
        for (let i = drawHistory.length - 1; i >= 0; i--) {
            let item = drawHistory[i];
            if (item.tool === 'eraser') continue; 
            let hit = false;
            if (item.tool === 'free') {
                for (let j = 0; j < item.points.length - 1; j++) {
                    if (pointToSegmentDist({x,y}, item.points[j], item.points[j+1]) < threshold) { hit = true; break; }
                }
            } else if (item.tool === 'line') {
                if (pointToSegmentDist({x,y}, item.start, item.end) < threshold) hit = true;
            } else if (item.tool === 'rect') {
                let p1 = item.start, p2 = {x: item.end.x, y: item.start.y}, p3 = item.end, p4 = {x: item.start.x, y: item.end.y};
                if (pointToSegmentDist({x,y}, p1, p2) < threshold || pointToSegmentDist({x,y}, p2, p3) < threshold ||
                    pointToSegmentDist({x,y}, p3, p4) < threshold || pointToSegmentDist({x,y}, p4, p1) < threshold) hit = true;
            }
            if (hit) {
                drawHistory.splice(i, 1);
                redrawCanvas();
                return;
            }
        }
    }

    function undo() {
        if (drawHistory.length > 0) { drawHistory.pop(); redrawCanvas(); }
    }

    function clearCanvas() {
        if(confirm("確定要清空所有筆跡嗎？")) {
            drawHistory = []; baseAnnotationImg = null; redrawCanvas();
        }
    }

    async function saveAnnotation() {
        const btn = document.querySelector(".save-btn");
        if(btn) btn.innerText = "儲存中...";
        
        // 檢查畫布是否為空
        const blank = document.createElement('canvas');
        blank.width = canvas.width; blank.height = canvas.height;
        const isBlank = canvas.toDataURL() === blank.toDataURL();
        
        const base64Image = isBlank ? "" : canvas.toDataURL("image/png");
        
        try {
            await db.collection("question_images").doc(currentViewerId).update({ annotationImage: base64Image });
            const item = window.currentItemsMap[currentViewerId];
            item.annotationImage = base64Image;
            
            // 儲存後，將當前畫面壓平成新的 baseImage，清空 history
            if(base64Image) loadBaseAnnotation(base64Image);
            else { baseAnnotationImg = null; drawHistory = []; redrawCanvas(); }
            
            alert("筆跡儲存成功！");
            cancelAnnotation(); 
        } catch (err) {
            console.error("儲存筆跡失敗", err); alert("儲存失敗，請重試。");
        } finally {
            if(btn) btn.innerText = "💾";
        }
    }

    function closeImageViewer() { 
        document.getElementById("imageViewerModal").style.display = "none"; 
        document.getElementById("viewerImage").src = ""; 
        cancelAnnotation();
    }
    function zoomImage(delta) {

    function drawHorizontalBarChart(data, filterSub) {

    function compressImage(file, maxSize = 1000, quality = 0.7) {
        return new Promise((resolve) => {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image(); img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas"); let width = img.width; let height = img.height;
                    if (width > height) { if (width > maxSize) { height *= maxSize / width; width = maxSize; } } 
                    else { if (height > maxSize) { width *= maxSize / height; height = maxSize; } }
                    canvas.width = width; canvas.height = height; const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL("image/jpeg", quality));
                };
            };
        });
    }

    }
    function updateAIPrompt(items) {
        const unitSet = new Set(); const conceptSet = new Set();
        items.forEach(item => { if (item.unit) unitSet.add(item.unit); if (item.concept) conceptSet.add(item.concept); });
        let unitString = Array.from(unitSet).join("、") || "無既有單元"; let conceptString = Array.from(conceptSet).join("、") || "無既有觀念";
        const promptTemplate = `這是一組考題照片。請分析照片中「我寫錯或有手寫痕跡」的所有題目。
如果上傳多張照片，請務必在每行開頭加上「[照片X]」。
請針對「每一道題」單獨輸出一行格式如下（以半形逗號隔開），不要額外解釋或引言：
[照片X] 科目,單元名稱,核心觀念,題型,題號備註

【限制清單】
* 欄位 1 (科目)：[國文, 英文, 數學, 物理, 化學, 生物, 地科, 歷史, 地理, 公民]
* 欄位 2 (單元名稱)：優先使用既有單元保持一致 -> [ ${unitString} ]
* 欄位 3 (核心觀念)：優先使用既有觀念保持一致 -> [ ${conceptString} ]
* 欄位 4 (題型)：[單選題, 多選題, 非選擇題]
* 欄位 5 (題號備註)：寫「第X題」。`;
        document.getElementById("aiPromptText").value = promptTemplate;
    }
    function copyPrompt() { navigator.clipboard.writeText(document.getElementById("aiPromptText").value).then(() => { alert("指令已複製！請貼給 AI。"); }); }
</script>
