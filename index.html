<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測錯題數據庫 - 自由備考版</title>
    <!-- 引入 Firebase v10 Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
    <!-- 引入 html2pdf.js 用於直接下載 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        /* --- 現代化暗色主題色票 --- */
        :root {
            --bg-color: #0f172a;       /* Slate 900 */
            --card-bg: #1e293b;        /* Slate 800 */
            --text-main: #f8fafc;      /* Slate 50 */
            --text-muted: #94a3b8;     /* Slate 400 */
            --accent-color: #6366f1;   /* Indigo 500 */
            --accent-hover: #4f46e5;   /* Indigo 600 */
            --border-color: #334155;   /* Slate 700 */
            --danger-color: #ef4444;   /* Red 500 */
            --warning-color: #f59e0b;  /* Amber 500 */
            --success-color: #10b981;  /* Emerald 500 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0; padding: 0;
        }

        /* --- 頂部導航列 --- */
        .navbar {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 100; padding: 12px 20px;
        }
        .nav-content {
            max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;
        }
        .nav-brand { font-size: 20px; font-weight: 700; margin: 0; white-space: nowrap; }
        
        /* 全局搜尋框 */
        .search-bar { flex-grow: 1; max-width: 400px; position: relative; }
        .search-bar input {
            width: 100%; padding: 10px 15px 10px 35px; border-radius: 20px; border: 1px solid var(--border-color);
            background-color: rgba(255,255,255,0.05); color: var(--text-main); font-size: 14px; box-sizing: border-box; transition: all 0.2s;
        }
        .search-bar input:focus { outline: none; border-color: var(--accent-color); background-color: rgba(255,255,255,0.1); }
        .search-bar::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.7; }

        .nav-actions { display: flex; gap: 10px; }
        .btn-nav {
            padding: 8px 16px; font-size: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: rgba(255,255,255,0.1); color: var(--text-main); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.15); }

        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }

        /* --- 控制面板 (篩選) --- */
        .control-panel {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px 20px; margin-bottom: 25px;
        }
        .filter-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .filter-group select {
            flex: 1; min-width: 140px; padding: 10px 12px; background-color: #0f172a; border: 1px solid var(--border-color);
            border-radius: 8px; color: var(--text-main); font-size: 14px; cursor: pointer;
        }

        /* 圖表區 */
        .chart-section { margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px; display: none; }
        .chart-section.active { display: block; }
        .btn-toggle-chart { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; margin-top: 10px; }
        .btn-toggle-chart:hover { color: var(--text-main); }

        /* --- 錯題卡片網格 --- */
        .questions-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding-bottom: 100px; }
        .question-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden;
            display: flex; flex-direction: column; transition: all 0.2s ease; cursor: pointer; position: relative; user-select: none;
        }
        .question-card:hover { border-color: #475569; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        .question-card.selected { border-color: var(--accent-color); box-shadow: 0 0 0 2px var(--accent-color); }

        /* 隱藏式 Checkbox */
        .card-checkbox {
            position: absolute; top: 10px; left: 10px; width: 22px; height: 22px; background-color: rgba(15, 23, 42, 0.7);
            border: 2px solid #94a3b8; border-radius: 6px; z-index: 10; opacity: 0; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .question-card:hover .card-checkbox, .question-card.selected .card-checkbox { opacity: 1; }
        .question-card.selected .card-checkbox { background-color: var(--accent-color); border-color: var(--accent-color); }
        .question-card.selected .card-checkbox::after { content: "✓"; color: white; font-size: 14px; font-weight: bold; }

        .question-img-container { width: 100%; height: 150px; background-color: #000; position: relative; }
        .question-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: opacity 0.2s; }
        .question-card:hover .question-img { opacity: 1; }

        .tag-subject-absolute {
            position: absolute; top: 10px; right: 10px; background-color: rgba(15, 23, 42, 0.8); color: white;
            padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.1);
        }

        .question-details { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        
        /* 熟練度標籤 */
        .mastery-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; margin-bottom: 8px; width: fit-content; }
        .badge-hard { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-medium { background-color: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-easy { background-color: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-unrated { background-color: rgba(148, 163, 184, 0.1); color: var(--text-muted); border: 1px solid rgba(148, 163, 184, 0.2); }

        .concept-text { font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; line-height: 1.3; }
        .unit-text { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
        
        /* --- 紅綠燈熟練度系統 (卡片底部) --- */
        .card-footer {
            margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid var(--border-color);
        }
        .mastery-group { display: flex; gap: 6px; }
        .btn-mastery {
            background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; color: var(--text-muted);
        }
        .btn-mastery:hover { background: rgba(255,255,255,0.1); }
        .btn-mastery.active-hard { background: rgba(239, 68, 68, 0.2); border-color: var(--danger-color); color: #fca5a5; }
        .btn-mastery.active-medium { background: rgba(245, 158, 11, 0.2); border-color: var(--warning-color); color: #fcd34d; }
        .btn-mastery.active-easy { background: rgba(16, 185, 129, 0.2); border-color: var(--success-color); color: #6ee7b7; }

        .btn-toggle-exp { background: none; color: var(--accent-color); border: none; font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px; }
        .btn-toggle-exp:hover { text-decoration: underline; }
        .explanation-img-box { display: none; margin-top: 10px; background-color: #000; border-radius: 6px; overflow: hidden; }

        /* --- 批量操作浮動工具列 --- */
        .batch-floating-bar {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background-color: rgba(30, 41, 59, 0.95);
            border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px); z-index: 1500; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; width: 90%; max-width: 700px;
        }
        .batch-floating-bar.active { bottom: 30px; pointer-events: auto; }
        .batch-left { display: flex; align-items: center; gap: 12px; }
        .batch-count-text { font-size: 14px; color: var(--text-main); font-weight: 600; }
        .batch-count-num { color: var(--warning-color); font-size: 16px; }
        .btn-batch-cancel { background: none; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; }
        .batch-right { display: flex; gap: 8px; flex-wrap: wrap; }
        .batch-right button { border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }

        /* --- 圖片檢視器 Modal --- */
        .viewer-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px); }
        .viewer-content { display: flex; flex-direction: column; width: 100%; height: 100%; max-width: 1200px; margin: 0 auto; position: relative; }
        .viewer-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; z-index: 2200; }
        .viewer-tools button { background: rgba(255,255,255,0.1); color: #fff; border: none; border-radius: 6px; padding: 6px 12px; margin-right: 8px; cursor: pointer; font-size: 13px; }
        .close-viewer { color: #fff; font-size: 28px; cursor: pointer; }
        .viewer-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background-color: rgba(255,255,255,0.1); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 2100; }
        .viewer-prev-btn { left: 20px; } .viewer-next-btn { right: 20px; }
        .viewer-img-container { flex-grow: 1; overflow: auto; text-align: center; padding: 10px; display: flex; align-items: center; justify-content: center; }
        #viewerImage { max-width: 100%; max-height: 75vh; object-fit: contain; transition: transform 0.2s ease-out; opacity: 0.5; border-radius: 8px; }
        .viewer-metadata { background: var(--card-bg); padding: 20px; border-top: 1px solid var(--border-color); z-index: 2200; border-radius: 20px 20px 0 0; }

        /* --- 共用 Modal 樣式 --- */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.85); overflow-y: auto; backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--bg-color); margin: 40px auto; padding: 25px; border: 1px solid var(--border-color); width: 95%; max-width: 900px; border-radius: 16px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 20px; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        
        /* 上傳區塊 */
        .prompt-box, .import-box { background-color: var(--card-bg); border: 1px dashed var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .prompt-box textarea, .import-box textarea { width: 100%; background: #0f172a; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px; border-radius:6px; }
        .upload-trigger { display: block; width: 100%; background: rgba(99, 102, 241, 0.05); border: 2px dashed var(--accent-color); padding: 30px 10px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 20px; }
        .upload-trigger input { display: none; }
        .queue-item { display: flex; gap: 15px; background: var(--card-bg); padding: 15px; border: 1px solid var(--border-color); border-radius: 10px; margin-bottom: 15px; }
        .queue-img-wrap { width: 200px; flex-shrink: 0; }
        .queue-img-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .queue-inputs { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; }
        .queue-inputs textarea, .queue-inputs input { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; border-radius: 6px; }
        
        /* 抽題設定區塊 */
        .setting-group { margin-bottom: 15px; }
        .setting-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-muted); }
        .setting-group select, .setting-group input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border-color); color: white; border-radius: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<!-- 頂部導航列 -->
<nav class="navbar">
    <div class="nav-content">
        <h1 class="nav-brand">學測錯題數據庫</h1>
        
        <!-- 全局搜尋框 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜尋觀念、單元或備註..." oninput="handleSearch()">
        </div>

        <div class="nav-actions">
            <button class="btn-nav btn-secondary" onclick="openRandomModal()">🎲 隨機特訓</button>
            <button class="btn-nav btn-primary" onclick="openModal()">＋ 新增錯題</button>
        </div>
    </div>
</nav>

<div class="container">
    <!-- 控制面板 -->
    <div class="control-panel">
        <div class="filter-group">
            <select id="filterSubject" onchange="renderQuestions()">
                <option value="全部">📚 全部科目</option>
                <option value="國文">國文</option>
                <option value="英文">英文</option>
                <option value="數學">數學</option>
                <option value="物理">物理</option>
                <option value="化學">化學</option>
                <option value="生物">生物</option>
                <option value="地科">地科</option>
                <option value="歷史">歷史</option>
                <option value="地理">地理</option>
                <option value="公民">公民</option>
            </select>
            <select id="filterMastery" onchange="renderQuestions()">
                <option value="全部">🚦 所有熟練度</option>
                <option value="hard">🔴 困難 (待加強)</option>
                <option value="medium">🟡 普通 (需複習)</option>
                <option value="easy">🟢 簡單 (已掌握)</option>
                <option value="unrated">⚪ 未評估</option>
            </select>
            <select id="sortOrder" onchange="renderQuestions()">
                <option value="newest">⏱️ 最新加入優先</option>
                <option value="oldest">⏱️ 最舊加入優先</option>
                <option value="reviewAsc">🔄 複習次數：少到多</option>
            </select>
        </div>
        
        <button class="btn-toggle-chart" onclick="toggleChartSection()">📊 顯示圖表 ▼</button>
        <div class="chart-section" id="chartSection">
            <div class="chart-container" id="chartContainer" style="width: 100%;">
                <canvas id="weaknessChart" style="display: block; width: 100%;"></canvas>
            </div>
        </div>
    </div>

    <!-- 錯題列表 -->
    <div class="questions-list" id="questionsList"></div>
</div>

<!-- 隨機特訓設定 Modal -->
<div id="randomModal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
        <span class="close-modal" onclick="closeRandomModal()">&times;</span>
        <h2 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:15px;">🎲 隨機特訓設定</h2>
        
        <div class="setting-group">
            <label>選擇要測驗的科目：</label>
            <select id="randomSubject">
                <option value="全部">📚 全部科目 (混考)</option>
                <option value="國文">國文</option>
                <option value="英文">英文</option>
                <option value="數學">數學</option>
                <option value="物理">物理</option>
                <option value="化學">化學</option>
                <option value="生物">生物</option>
                <option value="地科">地科</option>
                <option value="歷史">歷史</option>
                <option value="地理">地理</option>
                <option value="公民">公民</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label>抽題數量：</label>
            <input type="number" id="randomCount" value="20" min="1">
        </div>

        <button class="btn-nav btn-primary" style="width:100%; justify-content:center; padding:12px; margin-top:10px;" onclick="executeRandomQuiz()">開始抽題</button>
    </div>
</div>

<!-- 批次新增錯題 Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:15px;">批次新增錯題</h2>
        <div class="prompt-box">
            <label style="color:var(--success-color); font-weight:bold;">1. 獲取專屬 AI 指令</label>
            <textarea id="aiPromptText" rows="3" readonly></textarea>
            <button class="btn-nav btn-secondary" style="width:100%; justify-content:center; margin-top:10px;" onclick="copyPrompt()">📋 一鍵複製指令給 AI</button>
        </div>
        <label class="upload-trigger">
            <span style="font-size:16px; font-weight: 600; color:var(--text-main);">📁 點擊選取題目照片 (支援多選)</span>
            <input type="file" id="multiPhotoInput" accept="image/*" multiple onchange="handleFilesSelect(event)">
        </label>
        <div class="import-box" id="masterImportSection" style="display:none;">
            <label style="color:var(--success-color); font-weight:bold;">3. 貼入所有照片的 AI 解析</label>
            <textarea id="masterAiImport" rows="5" oninput="distributeMasterAi()"></textarea>
        </div>
        <div id="queueContainer"></div>
        <button id="submitAllBtn" class="btn-nav btn-primary" style="display:none; width:100%; justify-content:center; padding:15px; font-size:16px;" onclick="saveAllQuestions()">全部儲存並上傳</button>
    </div>
</div>

<!-- 圖片檢視器 Modal -->
<div id="imageViewerModal" class="viewer-modal">
    <button class="viewer-nav-btn viewer-prev-btn" onclick="navigateViewer(-1)">＜</button>
    <button class="viewer-nav-btn viewer-next-btn" onclick="navigateViewer(1)">＞</button>
    <div class="viewer-content">
        <div class="viewer-header">
            <div class="viewer-tools">
                <button onclick="zoomImage(0.3)">放大 ＋</button>
                <button onclick="zoomImage(-0.3)">縮小 －</button>
                <button onclick="resetZoom()">重設</button>
            </div>
            <span class="close-viewer" onclick="closeImageViewer()">&times;</span>
        </div>
        <div class="viewer-img-container" id="viewerImgContainer">
            <img id="viewerImage" src="" alt="放大圖片">
        </div>
        <div class="viewer-metadata" id="viewerMetadata"></div>
    </div>
</div>

<!-- 批量操作浮動工具列 -->
<div class="batch-floating-bar" id="batchFloatingBar">
    <div class="batch-left">
        <span class="batch-count-text">已選取 <span id="batchSelectCount" class="batch-count-num">0</span> 題</span>
        <button class="btn-batch-cancel" onclick="cancelSelection()">取消選取</button>
    </div>
    <div class="batch-right">
        <button class="btn-nav btn-primary" onclick="batchExportSmartPDF()">🖨️ 智慧列印 (附詳解)</button>
        <button class="btn-nav btn-secondary" onclick="batchExportWord()">📄 匯出 Word</button>
        <button class="btn-nav btn-secondary" style="color:var(--danger-color); border:1px solid var(--danger-color);" onclick="batchDelete()">🗑️ 刪除</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA5xWtkaPt0_5doRo55WLIbBroI22ypkZ8",
        authDomain: "ai-vocab-coach.firebaseapp.com",
        projectId: "ai-vocab-coach",
        storageBucket: "ai-vocab-coach.firebasestorage.app",
        messagingSenderId: "550257355969",
        appId: "1:550257355969:web:79e07e09c977e861163840"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let unsubscribe = null;
    window.currentItemsMap = {}; 
    let allItemsArray = []; 
    let filteredSortedItems = []; 
    let selectedFilesQueue = [];
    
    let searchQuery = "";
    let currentViewerId = null;
    let currentZoom = 1;
    let selectedCardIds = new Set();
    let lastSelectedId = null;
    let pressTimer;
    let chartExpanded = false;

    window.onload = function() {
        loadQuestions();
        setupSwipeGestures();
        window.addEventListener("resize", function() {
            if(document.getElementById("chartSection").classList.contains("active")) {
                triggerChartRebuilt();
            }
        });
    };

    function loadQuestions() {
        if (unsubscribe) unsubscribe();
        unsubscribe = db.collection("questions").onSnapshot((snapshot) => {
            allItemsArray = [];
            snapshot.forEach(doc => {
                const item = doc.data();
                item.id = doc.id;
                if (typeof item.reviewCount === 'undefined') item.reviewCount = 0;
                if (!item.mastery) item.mastery = 'unrated';
                
                allItemsArray.push(item);
                window.currentItemsMap[item.id] = item;
            });
            updateAIPrompt(allItemsArray);
            renderQuestions();
        }, (error) => { console.error("雲端讀取失敗:", error); });
    }

    /* --- 核心渲染與過濾邏輯 --- */
    function handleSearch() {
        searchQuery = document.getElementById("searchInput").value.toLowerCase().trim();
        renderQuestions();
    }

    function renderQuestions() {
        const filterSub = document.getElementById("filterSubject").value;
        const filterMastery = document.getElementById("filterMastery").value;
        const sortOrder = document.getElementById("sortOrder").value;

        // 1. 過濾資料
        filteredSortedItems = allItemsArray.filter(item => {
            if (filterSub !== "全部" && item.subject !== filterSub) return false;
            if (filterMastery !== "全部" && item.mastery !== filterMastery) return false;
            if (searchQuery) {
                const textToSearch = `${item.subject} ${item.unit} ${item.concept} ${item.notes || ''}`.toLowerCase();
                if (!textToSearch.includes(searchQuery)) return false;
            }
            return true;
        });

        // 2. 排序資料
        filteredSortedItems.sort((a, b) => {
            if (sortOrder === "newest") return b.timestamp - a.timestamp;
            if (sortOrder === "oldest") return a.timestamp - b.timestamp;
            if (sortOrder === "reviewAsc") return a.reviewCount - b.reviewCount;
            return 0;
        });

        // 3. 渲染 DOM
        const listContainer = document.getElementById("questionsList");
        listContainer.innerHTML = "";

        if (filteredSortedItems.length === 0) {
            listContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 50px; color: var(--text-muted);">沒有符合條件的題目</div>`;
        } else {
            filteredSortedItems.forEach(item => {
                const hasExplanation = item.hasExplanation || (item.explanationImage && item.explanationImage.trim().length > 0);
                const displayImgSrc = item.thumbnail || item.image || "";
                
                let badgeHtml = "";
                if (item.mastery === 'hard') badgeHtml = `<span class="mastery-badge badge-hard">🔴 困難</span>`;
                else if (item.mastery === 'medium') badgeHtml = `<span class="mastery-badge badge-medium">🟡 普通</span>`;
                else if (item.mastery === 'easy') badgeHtml = `<span class="mastery-badge badge-easy">🟢 簡單</span>`;
                else badgeHtml = `<span class="mastery-badge badge-unrated">⚪ 未評估</span>`;

                const card = document.createElement("div");
                card.className = "question-card";
                card.setAttribute("data-id", item.id);
                
                card.addEventListener("click", (e) => handleCardClick(e, item.id));
                card.addEventListener("touchstart", () => handleTouchStart(item.id), { passive: true });
                card.addEventListener("touchend", handleTouchCancel, { passive: true });

                card.innerHTML = `
                    <div class="card-checkbox"></div>
                    <div class="question-img-container">
                        <span class="tag-subject-absolute">${item.subject}</span>
                        <img class="question-img" src="${displayImgSrc}" alt="錯題縮圖">
                    </div>
                    <div class="question-details">
                        ${badgeHtml}
                        <div class="concept-text">${item.concept}</div>
                        <div class="unit-text">${item.unit}</div>
                        
                        <div class="card-footer">
                            <div class="mastery-group">
                                <button class="btn-mastery ${item.mastery === 'hard' ? 'active-hard' : ''}" onclick="setMastery(event, '${item.id}', 'hard')" title="標記為困難">🔴</button>
                                <button class="btn-mastery ${item.mastery === 'medium' ? 'active-medium' : ''}" onclick="setMastery(event, '${item.id}', 'medium')" title="標記為普通">🟡</button>
                                <button class="btn-mastery ${item.mastery === 'easy' ? 'active-easy' : ''}" onclick="setMastery(event, '${item.id}', 'easy')" title="標記為簡單">🟢</button>
                            </div>
                            ${hasExplanation ? `<button class="btn-toggle-exp" id="btn-exp-${item.id}" onclick="toggleExplanation(event, '${item.id}')">看詳解</button>` : ''}
                        </div>
                        <div class="explanation-img-box" id="exp-${item.id}"></div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        if(document.getElementById("chartSection").classList.contains("active")) {
            triggerChartRebuilt();
        }
        updateSelectionUI();
    }

    function executeRandomQuiz() {
        const subj = document.getElementById('randomSubject').value;
        let count = parseInt(document.getElementById('randomCount').value);
        
        if (isNaN(count) || count <= 0) {
            alert("請輸入有效的抽題數量！");
            return;
        }

        // 根據選擇的科目過濾題庫
        let pool = allItemsArray;
        if (subj !== '全部') {
            pool = pool.filter(item => item.subject === subj);
        }

        if (pool.length === 0) {
            alert(`目前題庫中沒有【${subj}】的題目可以抽取！`);
            return;
        }

        if (count > pool.length) count = pool.length;

        // 洗牌
        let shuffled = [...pool];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        const selected = shuffled.slice(0, count);
        
        // 同步更改主畫面的篩選器，讓使用者看到抽出的科目
        document.getElementById('filterSubject').value = subj;
        renderQuestions(); // 重新渲染主畫面

        // 選取抽出的題目
        selectedCardIds.clear();
        selected.forEach(item => selectedCardIds.add(item.id));
        updateSelectionUI();
        
        closeRandomModal();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function triggerChartRebuilt() {
        const filterSub = document.getElementById("filterSubject").value;
        const items = Object.values(window.currentItemsMap);
        let filteredItems = items.filter(item => filterSub === "全部" || item.subject === filterSub);
        
        const stats = {};
        if (filterSub === "全部") {
            filteredItems.forEach(item => { stats[item.subject] = (stats[item.subject] || 0) + 1; });
        } else {
            filteredItems.forEach(item => {
                const key = item.concept || "未分類觀念";
                stats[key] = (stats[key] || 0) + 1;
            });
        }
        const sortedStats = Object.entries(stats).sort((a, b) => b[1] - a[1]);
        drawHorizontalBarChart(sortedStats, filterSub);
    }

    function toggleChartExpand() {
        chartExpanded = !chartExpanded;
        triggerChartRebuilt();
    }

    function drawHorizontalBarChart(data, filterSub) {
        const canvas = document.getElementById("weaknessChart");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("chartContainer");
        const logicalWidth = container.clientWidth || 800; 

        if (data.length === 0) {
            canvas.style.height = "120px";
            canvas.width = logicalWidth * window.devicePixelRatio;
            canvas.height = 120 * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            ctx.clearRect(0, 0, logicalWidth, 120);
            ctx.fillStyle = "#94a3b8"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("尚無錯題數據", logicalWidth / 2, 60);
            let toggleBtn = document.getElementById("chartToggleBtn");
            if (toggleBtn) toggleBtn.style.display = "none";
            return;
        }

        let displayData = data;
        const hasMoreThanFive = data.length > 5;
        if (hasMoreThanFive && !chartExpanded) {
            displayData = data.slice(0, 5);
        }

        const rowHeight = 35; 
        const headerHeight = 40;
        const footerHeight = 20;
        const logicalHeight = displayData.length * rowHeight + headerHeight + footerHeight;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = logicalWidth * dpr;
        canvas.height = logicalHeight * dpr;
        canvas.style.width = logicalWidth + "px";
        canvas.style.height = logicalHeight + "px";
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);

        const leftMargin = Math.min(150, logicalWidth * 0.35); 
        const rightMargin = 50; 
        const chartWidth = logicalWidth - leftMargin - rightMargin;
        const maxVal = Math.max(...data.map(x => x[1]), 1);

        ctx.fillStyle = "#94a3b8"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left";
        ctx.fillText(filterSub === "全部" ? "【跨科目錯題數量】" : `【${filterSub} - 觀念排行】`, 10, 25);

        displayData.forEach(([label, count], i) => {
            const y = headerHeight + i * rowHeight;
            const barWidth = (count / maxVal) * chartWidth;

            ctx.fillStyle = "#f8fafc"; ctx.font = "13px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
            const displayLabel = label.length > 10 ? label.slice(0, 9) + "..." : label;
            ctx.fillText(displayLabel, leftMargin - 15, y + 12);

            ctx.fillStyle = "#334155"; ctx.fillRect(leftMargin, y, chartWidth, 18); 
            ctx.fillStyle = "#6366f1"; ctx.fillRect(leftMargin, y, barWidth, 18);   
            ctx.fillStyle = "#f8fafc"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
            ctx.fillText(`${count} 題`, leftMargin + barWidth + 8, y + 10);
        });

        let toggleBtn = document.getElementById("chartToggleBtn");
        if (!toggleBtn) {
            toggleBtn = document.createElement("button");
            toggleBtn.id = "chartToggleBtn";
            toggleBtn.style.cssText = "width:auto; margin:15px auto 0; padding:6px 20px; background:rgba(255,255,255,0.05); color:var(--text-muted); border:none; border-radius:6px; cursor:pointer; font-size:12px; display:block; transition: background 0.2s;";
            toggleBtn.onmouseover = () => toggleBtn.style.background = "rgba(255,255,255,0.1)";
            toggleBtn.onmouseout = () => toggleBtn.style.background = "rgba(255,255,255,0.05)";
            toggleBtn.onclick = toggleChartExpand;
            canvas.parentNode.appendChild(toggleBtn);
        }
        if (hasMoreThanFive) {
            toggleBtn.style.display = "block";
            toggleBtn.innerText = chartExpanded ? "收起排行 ▲" : `查看全部排行 (${data.length}) ▼`;
        } else {
            toggleBtn.style.display = "none";
        }
    }

    function distributeMasterAi() {
        const masterVal = document.getElementById("masterAiImport").value.trim();
        selectedFilesQueue.forEach(qItem => {
            const ta = document.getElementById(`ai-${qItem.id}`);
            if (ta) ta.value = "";
        });

        if (!masterVal) return;
        const photoLinesMap = {};
        selectedFilesQueue.forEach((_, idx) => { photoLinesMap[idx + 1] = []; });

        const lines = masterVal.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        lines.forEach(line => {
            const match = line.match(/^(?:\[?\s*照片|Page|Img|圖)?\s*(\d+)\s*\]?[:：\s,，\.]*(.*)$/i);
            if (match) {
                const photoNum = parseInt(match[1], 10);
                const cleanLine = match[2].trim();
                if (photoLinesMap[photoNum]) photoLinesMap[photoNum].push(cleanLine);
            }
        });

        selectedFilesQueue.forEach((qItem, idx) => {
            const ta = document.getElementById(`ai-${qItem.id}`);
            if (ta && photoLinesMap[idx + 1]) ta.value = photoLinesMap[idx + 1].join('\n');
        });
    }

    function compressImage(file, maxSize = 1000, quality = 0.7) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    let width = img.width; let height = img.height;
                    if (width > height) {
                        if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                    } else {
                        if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL("image/jpeg", quality));
                };
            };
        });
    }

    async function saveAllQuestions() {
        if (selectedFilesQueue.length === 0) return;
        const submitBtn = document.getElementById("submitAllBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ 壓縮上傳中...";

        try {
            const batch = db.batch();
            let successCount = 0;
            const baseGroupId = Date.now(); 
            let timeOffset = 0;

            for (let i = 0; i < selectedFilesQueue.length; i++) {
                const qItem = selectedFilesQueue[i];
                const aiText = document.getElementById(`ai-${qItem.id}`).value.trim();
                const manualNote = document.getElementById(`note-${qItem.id}`).value.trim();
                const expFileInput = document.getElementById(`exp-${qItem.id}`);

                if (!aiText) continue; 
                
                const thumbBase64 = await compressImage(qItem.file, 200, 0.4);
                const fullBase64 = await compressImage(qItem.file, 1200, 0.8);
                
                let expBase64 = null;
                if (expFileInput.files && expFileInput.files.length > 0) {
                    expBase64 = await compressImage(expFileInput.files[0], 1200, 0.8);
                }

                const lines = aiText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                lines.forEach(line => {
                    const parts = line.split(/[,，]/);
                    if (parts.length >= 4) {
                        let finalNotes = parts[4] ? parts[4].trim() : "";
                        if (manualNote) finalNotes = finalNotes ? `${manualNote} (${finalNotes})` : manualNote;

                        const docRef = db.collection("questions").doc();
                        const questionMeta = {
                            subject: parts[0].trim(),
                            unit: parts[1].trim(),
                            concept: parts[2].trim(),
                            type: parts[3].trim(),
                            thumbnail: thumbBase64,
                            hasExplanation: !!expBase64,
                            notes: finalNotes,
                            reviewCount: 0,
                            mastery: 'unrated', 
                            timestamp: baseGroupId + timeOffset,
                            groupId: baseGroupId
                        };
                        batch.set(docRef, questionMeta);

                        const imgDocRef = db.collection("question_images").doc(docRef.id);
                        batch.set(imgDocRef, {
                            image: fullBase64,
                            explanationImage: expBase64
                        });

                        successCount++;
                        timeOffset++; 
                    }
                });
            }

            if (successCount > 0) {
                await batch.commit();
                alert(`上傳成功！處理了 ${successCount} 題。`);
                closeModal(); 
            } else { alert("未偵測到有效格式！"); }
        } catch (err) { alert("上傳失敗：" + err.message); }
        finally { submitBtn.disabled = false; submitBtn.innerText = "全部儲存並上傳"; }
    }

    function handleCardClick(e, id) {
        const isCheckboxClick = e.target.classList.contains('card-checkbox');
        const isSelectionMode = selectedCardIds.size > 0 || e.shiftKey || isCheckboxClick;

        if (isSelectionMode) {
            e.preventDefault(); e.stopPropagation();
            if (e.shiftKey && lastSelectedId && lastSelectedId !== id) {
                const activeIds = filteredSortedItems.map(item => item.id);
                const startIdx = activeIds.indexOf(lastSelectedId);
                const endIdx = activeIds.indexOf(id);
                if (startIdx !== -1 && endIdx !== -1) {
                    const min = Math.min(startIdx, endIdx);
                    const max = Math.max(startIdx, endIdx);
                    const targetState = !selectedCardIds.has(id);
                    for (let i = min; i <= max; i++) {
                        if (targetState) selectedCardIds.add(activeIds[i]);
                        else selectedCardIds.delete(activeIds[i]);
                    }
                }
            } else {
                if (selectedCardIds.has(id)) selectedCardIds.delete(id);
                else selectedCardIds.add(id);
            }
            lastSelectedId = id;
            updateSelectionUI();
        } else {
            openImageViewer(id);
        }
    }

    function handleTouchStart(id) {
        pressTimer = window.setTimeout(() => {
            if (!selectedCardIds.has(id)) {
                selectedCardIds.add(id); lastSelectedId = id; updateSelectionUI();
                if (navigator.vibrate) navigator.vibrate(50);
            }
        }, 600);
    }
    function handleTouchCancel() { window.clearTimeout(pressTimer); }

    function updateSelectionUI() {
        document.querySelectorAll(".question-card").forEach(card => {
            const id = card.getAttribute("data-id");
            if (selectedCardIds.has(id)) card.classList.add("selected");
            else card.classList.remove("selected");
        });
        const bar = document.getElementById("batchFloatingBar");
        const countSpan = document.getElementById("batchSelectCount");
        if (selectedCardIds.size > 0) {
            countSpan.innerText = selectedCardIds.size; bar.classList.add("active");
        } else { bar.classList.remove("active"); }
    }
    function cancelSelection() { selectedCardIds.clear(); lastSelectedId = null; updateSelectionUI(); }

    async function batchDelete() {
        if (selectedCardIds.size === 0) return;
        if (!confirm(`確定要永久刪除這 ${selectedCardIds.size} 題錯題嗎？`)) return;
        const batch = db.batch();
        selectedCardIds.forEach(id => { 
            batch.delete(db.collection("questions").doc(id)); 
            batch.delete(db.collection("question_images").doc(id)); 
        });
        try { await batch.commit(); cancelSelection(); } catch (err) { alert("批量刪除失敗：" + err.message); }
    }

    async function batchExportWord() {
        if (selectedCardIds.size === 0) return;
        const btn = document.querySelectorAll(".btn-batch-secondary")[0];
        const originalText = btn.innerText;
        btn.innerText = "⏳ 產生中...";

        let contentHtml = "";
        for (let id of selectedCardIds) {
            const item = window.currentItemsMap[id];
            let imgSrc = item.image;
            if (!imgSrc) {
                if (item.fullImageLoaded) imgSrc = item.fullImage;
                else {
                    try {
                        const imgDoc = await db.collection("question_images").doc(id).get();
                        if (imgDoc.exists) {
                            imgSrc = imgDoc.data().image;
                            item.fullImage = imgSrc;
                            item.fullImageLoaded = true;
                        }
                    } catch(e) {}
                }
            }
            const finalImgSrc = imgSrc || item.thumbnail || "";
            contentHtml += `
                <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #ccc;">
                    <h3 style="color: #333; margin-bottom: 5px; font-family: sans-serif;">【${item.subject}】${item.unit} - ${item.concept}</h3>
                    ${item.notes ? `<p style="color: #555; font-size: 14px; margin-bottom: 10px; font-family: sans-serif;">備註: ${item.notes}</p>` : ''}
                    <p><img src="${finalImgSrc}" style="max-width: 600px; width: 100%; height: auto;" /></p>
                    <br><br>
                </div>
            `;
        }

        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>學測錯題實戰卷</title></head><body>";
        const footer = "</body></html>";
        const sourceHTML = header + contentHtml + footer;

        const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const fileDownload = document.createElement("a");
        fileDownload.href = url;
        fileDownload.download = '學測錯題實戰卷.doc';
        document.body.appendChild(fileDownload);
        fileDownload.click();
        
        setTimeout(() => {
            document.body.removeChild(fileDownload);
            URL.revokeObjectURL(url);
            btn.innerText = originalText;
            cancelSelection();
        }, 500);
    }

    async function openImageViewer(id) {
        currentViewerId = id; resetZoom();
        const item = window.currentItemsMap[id];
        if (!item) return;
        const viewerImg = document.getElementById("viewerImage");
        viewerImg.src = item.thumbnail || item.image || ""; viewerImg.style.opacity = "0.5";
        document.getElementById("imageViewerModal").style.display = "block";
        if (!item.fullImageLoaded && !item.image) {
            try {
                const imgDoc = await db.collection("question_images").doc(id).get();
                if (imgDoc.exists) {
                    item.fullImage = imgDoc.data().image; item.fullExplanationImage = imgDoc.data().explanationImage; item.fullImageLoaded = true;
                }
            } catch(err) {}
        }
        if (currentViewerId === id) { viewerImg.src = item.fullImage || item.image || viewerImg.src; viewerImg.style.opacity = "1"; }
    }
    function closeImageViewer() { document.getElementById("imageViewerModal").style.display = "none"; document.getElementById("viewerImage").src = ""; }
    function zoomImage(delta) { currentZoom += delta; if (currentZoom < 0.5) currentZoom = 0.5; if (currentZoom > 5) currentZoom = 5; document.getElementById("viewerImage").style.transform = `scale(${currentZoom})`; }
    function resetZoom() { currentZoom = 1; document.getElementById("viewerImage").style.transform = `scale(1)`; }
    function navigateViewer(direction) {
        if (filteredSortedItems.length <= 1) return;
        let idx = filteredSortedItems.findIndex(item => item.id === currentViewerId);
        if (idx === -1) return;
        let nextIdx = idx + direction;
        if (nextIdx < 0) nextIdx = filteredSortedItems.length - 1;
        if (nextIdx >= filteredSortedItems.length) nextIdx = 0;
        openImageViewer(filteredSortedItems[nextIdx].id);
    }
    function setupSwipeGestures() {
        let touchStartX = 0; let touchEndX = 0; const container = document.getElementById("viewerImgContainer");
        container.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        container.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX - touchEndX > 60) navigateViewer(1); else if (touchEndX - touchStartX > 60) navigateViewer(-1);
        }, { passive: true });
    }

    function updateAIPrompt(items) {
        const unitSet = new Set();
        const conceptSet = new Set();
        items.forEach(item => { 
            if (item.unit) unitSet.add(item.unit); 
            if (item.concept) conceptSet.add(item.concept);
        });
        let unitString = Array.from(unitSet).join("、") || "無既有單元";
        let conceptString = Array.from(conceptSet).join("、") || "無既有觀念";

        const promptTemplate = `這是一組考題照片。請分析照片中「我寫錯或有手寫痕跡」的所有題目。
如果上傳多張照片，請務必在每行開頭加上「[照片X]」。
請針對「每一道題」單獨輸出一行格式如下（以半形逗號隔開），不要額外解釋或引言：
[照片X] 科目,單元名稱,核心觀念,題型,題號備註

【限制清單】
* 欄位 1 (科目)：[國文, 英文, 數學, 物理, 化學, 生物, 地科, 歷史, 地理, 公民]
* 欄位 2 (單元名稱)：優先使用既有單元保持一致 -> [ ${unitString} ]
* 欄位 3 (核心觀念)：優先使用既有觀念保持一致 -> [ ${conceptString} ]
* 欄位 4 (題型)：[單選題, 多選題, 非選擇題]
* 欄位 5 (題號備註)：寫「第X題」。`;

        document.getElementById("aiPromptText").value = promptTemplate;
    }

    function copyPrompt() {
        navigator.clipboard.writeText(document.getElementById("aiPromptText").value).then(() => {
            alert("指令已複製！請貼給 AI。");
        });
    }
</script>
