<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測錯題數據庫</title>
    <!-- 引入 Firebase v10 Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
    <!-- 引入 html2pdf.js 用於直接下載 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #3f51b5;
            --accent-hover: #5c6bc0;
            --border-color: #333333;
            --danger-color: #e57373;
            --success-color: #4caf50;
            --warning-color: #ff9800;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .btn-main-add {
            width: 100%;
            max-width: 400px;
            margin: 0 auto 25px auto;
            display: block;
            padding: 15px;
            font-size: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        .btn-main-add:hover {
            background-color: var(--accent-hover);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        select {
            width: 100%;
            padding: 8px;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        select:focus { outline: none; border-color: var(--accent-color); }

        .chart-container {
            text-align: center;
            margin-top: 15px;
            overflow-x: auto;
        }

        /* 自適應緊湊網格：一行多圖相片牆 */
        .questions-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            user-select: none;
        }

        /* 隱形多選藍框狀態 */
        .question-card.selected {
            border: 2px solid var(--accent-color) !important;
            box-shadow: 0 0 12px rgba(63, 81, 181, 0.6);
        }

        .question-img-container {
            width: 100%;
            height: 120px; 
            background-color: #000;
            overflow: hidden;
            position: relative;
        }

        .question-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .question-details {
            padding: 10px 12px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-meta-line {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .tag-subject {
            background-color: #00796b;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 8px;
        }

        .meta-gray-text {
            font-size: 11px;
            color: #888;
            margin-right: 8px;
        }

        .concept-text {
            font-size: 13px;
            margin: 2px 0 6px 0;
            color: #fff;
            line-height: 1.3;
        }

        .notes-box {
            font-size: 12px;
            color: #b0b0b0;
            background-color: #262626;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 3px;
            border-left: 3px solid var(--accent-color);
            word-break: break-all;
        }

        .explanation-section {
            margin-top: 6px;
            border-top: 1px solid #2a2a2a;
            padding-top: 6px;
        }

        .btn-toggle-exp {
            background-color: #333;
            color: #ddd;
            padding: 4px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-toggle-exp:hover { background-color: #444; }
        
        .explanation-img-box { display: none; margin-top: 6px; background-color: #000; border-radius: 4px; overflow: hidden; }

        /* --- 劇院級圖片檢視器 Modal 樣式 --- */
        .viewer-modal {
            display: none; 
            position: fixed; 
            z-index: 2000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.95); 
            backdrop-filter: blur(5px);
        }

        .viewer-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #111;
            z-index: 2200;
        }

        .viewer-tools button {
            background: #333; color: #fff; border: 1px solid #555; border-radius: 20px;
            padding: 6px 15px; margin-right: 8px; cursor: pointer; font-size: 13px;
        }
        .viewer-tools button:hover { background: #555; }

        .close-viewer {
            color: #fff; font-size: 30px; cursor: pointer; font-weight: bold;
        }

        .viewer-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.6);
            color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            z-index: 2100;
        }
        .viewer-nav-btn:hover { background-color: rgba(255,255,255,0.25); }
        .viewer-prev-btn { left: 20px; }
        .viewer-next-btn { right: 20px; }

        @media (max-width: 600px) {
            .viewer-nav-btn { display: none; } 
        }

        .viewer-img-container {
            flex-grow: 1;
            overflow: auto;
            text-align: center;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #viewerImage {
            max-width: 100%;
            max-height: 68vh;
            object-fit: contain;
            transition: transform 0.2s ease-out;
            transform-origin: center center;
            opacity: 0.5;
        }

        .viewer-metadata {
            background: #1a1a1a;
            padding: 15px 20px;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 2200;
        }

        .viewer-action-line {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #333;
            padding-top: 10px;
            flex-wrap: wrap;
        }
        .viewer-action-line button {
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
        }
        .viewer-btn-review { background-color: var(--warning-color); color: #000; }
        .viewer-btn-review:hover { background-color: #fb8c00; }
        .viewer-btn-group-review { background-color: var(--success-color); color: #fff; }
        .viewer-btn-group-review:hover { background-color: #45a049; }
        .viewer-btn-delete { background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color) !important; margin-left: auto; }
        .viewer-btn-delete:hover { background-color: rgba(229, 115, 115, 0.1); }

        /* --- 批量操作浮動工具列 --- */
        .batch-floating-bar {
            position: fixed;
            bottom: -80px; 
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(26, 26, 26, 0.95);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 1500;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            width: 90%;
            max-width: 600px;
        }
        .batch-floating-bar.active {
            bottom: 25px;
            pointer-events: auto;
        }
        .batch-floating-bar span {
            font-size: 14px;
            color: #fff;
            font-weight: bold;
            white-space: nowrap;
        }
        .batch-floating-bar button {
            background-color: var(--warning-color);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            margin: 0;
        }
        .batch-floating-bar button:hover { background-color: #fb8c00; }
        .batch-floating-bar .btn-batch-export {
            background-color: var(--accent-color);
            color: white;
        }
        .batch-floating-bar .btn-batch-export:hover { background-color: var(--accent-hover); }
        .batch-floating-bar .btn-batch-word {
            background-color: #2196F3;
            color: white;
        }
        .batch-floating-bar .btn-batch-word:hover { background-color: #1976D2; }
        .batch-floating-bar .btn-batch-delete {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
        }
        .batch-floating-bar .btn-batch-delete:hover { background-color: rgba(229, 115, 115, 0.1); }
        .batch-floating-bar .btn-batch-cancel {
            background-color: #555;
            color: #fff;
        }
        .batch-floating-bar .btn-batch-cancel:hover { background-color: #666; }

        /* --- 上傳與隊列 Modal 樣式 --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background-color: rgba(0,0,0,0.85); 
            overflow-y: auto;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: var(--bg-color);
            margin: 40px auto;
            padding: 25px;
            border: 1px solid var(--border-color);
            width: 95%;
            max-width: 900px;
            border-radius: 12px;
            position: relative;
            box-sizing: border-box; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .close-modal {
            position: absolute; right: 20px; top: 15px; color: #888; font-size: 28px; font-weight: bold; cursor: pointer;
        }
        .close-modal:hover { color: #fff; }

        .modal h2 { margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        .prompt-box {
            background-color: #1a1a1a; border: 1px dashed var(--success-color); padding: 15px; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;
        }
        .prompt-box textarea { width: 100%; background: #111; color: #888; border: 1px solid #333; padding: 8px; font-size: 12px; box-sizing:border-box; border-radius:4px; }
        .btn-copy { width: 100%; padding: 8px; background: var(--success-color); color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 8px; }

        .import-box {
            background-color: #252525; border: 1px dashed var(--accent-color); padding: 15px; border-radius: 6px; margin-bottom: 20px; box-sizing: border-box;
        }
        .import-box textarea { width: 100%; background: #111; color: #fff; border: 1px solid #444; padding: 8px; font-size: 13px; box-sizing:border-box; border-radius:4px; }

        .upload-trigger {
            display: block; width: 100%; box-sizing: border-box; background: #252525; border: 2px dashed var(--accent-color); padding: 20px 10px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 20px; transition: background 0.2s;
        }
        .upload-trigger:hover { background: #2a2a2a; }
        .upload-trigger input { display: none; }

        .queue-item {
            display: flex; flex-direction: column; gap: 15px; background: var(--card-bg); padding: 15px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 15px; box-sizing: border-box;
        }

        @media (min-width: 600px) { .queue-item { flex-direction: row; } }
        @media (max-width: 600px) {
            .modal-content { margin: 20px auto; padding: 15px; width: 98%; }
            .upload-trigger span { font-size: 14px !important; }
        }

        .queue-img-wrap { width: 100%; max-width: 200px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
        .queue-img-preview { width: 100%; height: 150px; object-fit: cover; background: #000; border-radius: 6px; border: 1px solid #444; }
        .queue-inputs { flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
        .queue-inputs label { margin-top: 0; font-size: 13px; color: #aaa; }
        .queue-inputs textarea, .queue-inputs input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 8px; border-radius: 4px; box-sizing: border-box; }
        .queue-inputs textarea { height: 90px; resize: vertical; }

        .btn-submit-all {
            width: 100%; padding: 15px; background-color: var(--accent-color); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-sizing: border-box;
        }
        .btn-submit-all:disabled { background-color: #555; cursor: not-allowed; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>學測錯題數據庫</h1>
    </header>

    <button class="btn-main-add" onclick="openModal()">＋ 新增錯題</button>

    <div class="card">
        <h3 style="margin-top: 0; display: inline-block;">數據篩選</h3>
        <div class="filter-group">
            <select id="filterSubject" onchange="loadQuestions()">
                <option value="全部">全部科目</option>
                <option value="國文">國文</option>
                <option value="英文">英文</option>
                <option value="數學">數學</option>
                <option value="物理">物理</option>
                <option value="化學">化學</option>
                <option value="生物">生物</option>
                <option value="地科">地科</option>
                <option value="歷史">歷史</option>
                <option value="地理">地理</option>
                <option value="公民">公民</option>
            </select>
            <select id="sortOrder" onchange="loadQuestions()">
                <option value="newest">最新加入優先</option>
                <option value="oldest">最舊加入優先</option>
                <option value="reviewAsc">複習次數：少到多</option>
                <option value="reviewDesc">複習次數：多到少</option>
            </select>
        </div>
        
        <div class="chart-container" id="chartContainer" style="width: 100%;">
            <canvas id="weaknessChart" style="display: block; width: 100%;"></canvas>
        </div>
    </div>

    <div class="questions-list" id="questionsList"></div>
</div>

<div id="addModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2>批次新增錯題</h2>

        <div class="prompt-box">
            <label style="color:var(--success-color); font-weight:bold; margin-top:0; display:block;">1. 獲取專屬 AI 指令 (已自動整合雲端既有標籤)</label>
            <textarea id="aiPromptText" rows="3" readonly></textarea>
            <button class="btn-copy" onclick="copyPrompt()">一鍵複製指令給 AI</button>
        </div>

        <label style="display:block; font-weight:bold; color:#fff; font-size:15px; margin-bottom:10px;">2. 選擇考卷照片</label>
        <label class="upload-trigger">
            <span style="font-size:16px; color:#fff;">📁 點擊選取題目照片</span>
            <input type="file" id="multiPhotoInput" accept="image/*" multiple onchange="handleFilesSelect(event)">
        </label>

        <div class="import-box" id="masterImportSection" style="display:none; border-color: var(--success-color);">
            <label style="color:var(--success-color); font-weight:bold; margin-top:0; display:block; margin-bottom: 5px;">3. 貼入所有照片的 AI 解析</label>
            <textarea id="masterAiImport" rows="5" placeholder="把 AI 給你的整串解析直接整段貼在這裡..." oninput="distributeMasterAi()"></textarea>
        </div>

        <div id="queueContainer"></div>

        <button id="submitAllBtn" class="btn-submit-all" style="display:none;" onclick="saveAllQuestions()">全部儲存並上傳</button>
    </div>
</div>

<div id="imageViewerModal" class="viewer-modal">
    <button class="viewer-nav-btn viewer-prev-btn" onclick="navigateViewer(-1)">＜</button>
    <button class="viewer-nav-btn viewer-next-btn" onclick="navigateViewer(1)">＞</button>

    <div class="viewer-content">
        <div class="viewer-header">
            <div class="viewer-tools">
                <button onclick="zoomImage(0.3)">＋</button>
                <button onclick="zoomImage(-0.3)">－</button>
                <button onclick="resetZoom()">重設</button>
            </div>
            <span class="close-viewer" onclick="closeImageViewer()">&times;</span>
        </div>
        <div class="viewer-img-container" id="viewerImgContainer">
            <img id="viewerImage" src="" alt="放大圖片">
        </div>
        <div class="viewer-metadata" id="viewerMetadata"></div>
    </div>
</div>

<div class="batch-floating-bar" id="batchFloatingBar">
    <button class="btn-batch-cancel" onclick="cancelSelection()">取消</button>
    <span>已選取 <span id="batchSelectCount" style="color: var(--warning-color);">0</span> 題</span>
    <button class="btn-batch-export" onclick="batchExportA4()">列印 PDF</button>
    <button class="btn-batch-word" onclick="batchExportWord()">匯出 Word</button>
    <button onclick="batchIncrementReview()">批量複習 +1</button>
    <button class="btn-batch-delete" onclick="batchDelete()">批量刪除</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA5xWtkaPt0_5doRo55WLIbBroI22ypkZ8",
        authDomain: "ai-vocab-coach.firebaseapp.com",
        projectId: "ai-vocab-coach",
        storageBucket: "ai-vocab-coach.firebasestorage.app",
        messagingSenderId: "550257355969",
        appId: "1:550257355969:web:79e07e09c977e861163840"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let unsubscribe = null;
    let selectedFilesQueue = []; 
    
    window.currentItemsMap = {}; 
    let filteredSortedItems = []; 
    let currentViewerId = null;
    let currentZoom = 1;

    let selectedCardIds = new Set();
    let lastSelectedId = null;
    let pressTimer;
    let chartExpanded = false; 

    window.onload = function() {
        loadQuestions();
        window.addEventListener("resize", function() {
            const filterSubject = document.getElementById("filterSubject").value;
            triggerChartRebuilt(filterSubject);
        });
        setupSwipeGestures();
    };

    function loadQuestions() {
        if (unsubscribe) unsubscribe();
        const filterSubject = document.getElementById("filterSubject").value;
        const sortOrder = document.getElementById("sortOrder").value;

        unsubscribe = db.collection("questions").onSnapshot((snapshot) => {
            const allItems = [];
            snapshot.forEach(doc => {
                const item = doc.data();
                item.id = doc.id;
                if (typeof item.reviewCount === 'undefined') item.reviewCount = 0;
                allItems.push(item);
                window.currentItemsMap[item.id] = item;
            });
            updateAIPrompt(allItems);
            processAndRender(allItems, filterSubject, sortOrder);
        }, (error) => {
            console.error("雲端讀取失敗:", error);
        });
    }

    /* --- 圖文分離：劇院級動態高畫質載入 --- */
    async function openImageViewer(id) {
        currentViewerId = id;
        resetZoom();
        const item = window.currentItemsMap[id];
        if (!item) return;

        const viewerImg = document.getElementById("viewerImage");
        viewerImg.src = item.thumbnail || item.image || "";
        viewerImg.style.opacity = "0.5";

        renderViewerContent(id);
        document.getElementById("imageViewerModal").style.display = "block";

        if (!item.fullImageLoaded && !item.image) {
            try {
                const imgDoc = await db.collection("question_images").doc(id).get();
                if (imgDoc.exists) {
                    item.fullImage = imgDoc.data().image;
                    item.fullExplanationImage = imgDoc.data().explanationImage;
                    item.fullImageLoaded = true;
                }
            } catch(err) { console.error("抓取高畫質圖片失敗:", err); }
        }

        if (currentViewerId === id) {
            viewerImg.src = item.fullImage || item.image || viewerImg.src;
            viewerImg.style.opacity = "1";
        }
    }

    window.toggleExplanation = async function(id) {
        event.stopPropagation();
        const box = document.getElementById(`exp-${id}`);
        const btn = document.getElementById(`btn-exp-${id}`);
        const item = window.currentItemsMap[id];

        if (box.style.display === "none" || box.style.display === "") {
            btn.innerText = "載入中...";
            let expSrc = item.explanationImage;

            if (!expSrc && item.hasExplanation) {
                if (item.fullExplanationImage) {
                    expSrc = item.fullExplanationImage;
                } else {
                    try {
                        const imgDoc = await db.collection("question_images").doc(id).get();
                        if (imgDoc.exists) {
                            expSrc = imgDoc.data().explanationImage;
                            item.fullExplanationImage = expSrc;
                            item.fullImage = imgDoc.data().image; 
                            item.fullImageLoaded = true;
                        }
                    } catch(e) { console.error("詳解載入失敗", e); }
                }
            }

            if (expSrc) {
                box.innerHTML = `<img class="question-img" src="${expSrc}" alt="詳解">`;

    function zoomImage(delta) {
        currentZoom += delta;
        if (currentZoom < 0.5) currentZoom = 0.5;
        if (currentZoom > 5) currentZoom = 5;
        document.getElementById("viewerImage").style.transform = `scale(${currentZoom})`;
    }

    function resetZoom() {
        currentZoom = 1;
        document.getElementById("viewerImage").style.transform = `scale(1)`;
    }

    function navigateViewer(direction) {
        if (filteredSortedItems.length <= 1) return;
        let idx = filteredSortedItems.findIndex(item => item.id === currentViewerId);
        if (idx === -1) return;

        let nextIdx = idx + direction;
        if (nextIdx < 0) nextIdx = filteredSortedItems.length - 1;
        if (nextIdx >= filteredSortedItems.length) nextIdx = 0;

        openImageViewer(filteredSortedItems[nextIdx].id);
    }

    function setupSwipeGestures() {
        let touchStartX = 0;
        let touchEndX = 0;
        const container = document.getElementById("viewerImgContainer");

        container.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        container.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            const threshold = 60;
            if (touchStartX - touchEndX > threshold) navigateViewer(1);
            else if (touchEndX - touchStartX > threshold) navigateViewer(-1);
        }, { passive: true });
    }

    async function viewerIncrementReview() {
        const id = currentViewerId;
        const item = window.currentItemsMap[id];
        if (!item) return;

        item.reviewCount = (item.reviewCount || 0) + 1;
        renderViewerContent(id);

        try {
            await db.collection("questions").doc(id).update({ reviewCount: item.reviewCount });
        } catch (err) { console.error(err); }
    }

    async function viewerIncrementGroupReview() {
        const id = currentViewerId;
        const item = window.currentItemsMap[id];
        if (!item) return;

        const gid = item.groupId || item.timestamp;
        filteredSortedItems.forEach(i => {
            if ((i.groupId || i.timestamp) === gid) i.reviewCount = (i.reviewCount || 0) + 1;
        });
        renderViewerContent(id);

        try {
            const queryField = item.groupId ? "groupId" : "timestamp";
            const snapshot = await db.collection("questions").where(queryField, "==", gid).get();
            const batch = db.batch();
            snapshot.forEach(doc => {
                batch.update(db.collection("questions").doc(doc.id), { 
                    reviewCount: firebase.firestore.FieldValue.increment(1) 
                });
            });
            await batch.commit();
        } catch (err) { console.error(err); }
    }

    async function viewerDeleteQuestion() {
        const id = currentViewerId;
        if (!confirm("確定要刪除嗎？")) return;

        let idx = filteredSortedItems.findIndex(item => item.id === id);
        let nextId = null;
        if (filteredSortedItems.length > 1) {
            nextId = (idx < filteredSortedItems.length - 1) ? filteredSortedItems[idx + 1].id : filteredSortedItems[idx - 1].id;
        }

        try {
            await db.collection("questions").doc(id).delete();
            await db.collection("question_images").doc(id).delete(); 
            if (nextId) openImageViewer(nextId);
            else closeImageViewer();
        } catch (err) { alert("刪除失敗：" + err.message); }
    }

    /* --- 無框隱形多選邏輯 --- */
    function handleCardClick(e, id) {
        const isSelectionMode = selectedCardIds.size > 0 || e.shiftKey;

        if (isSelectionMode) {
            e.preventDefault();
            e.stopPropagation();

            if (e.shiftKey && lastSelectedId && lastSelectedId !== id) {
                const activeIds = filteredSortedItems.map(item => item.id);
                const startIdx = activeIds.indexOf(lastSelectedId);
                const endIdx = activeIds.indexOf(id);

                if (startIdx !== -1 && endIdx !== -1) {
                    const min = Math.min(startIdx, endIdx);
                    const max = Math.max(startIdx, endIdx);
                    const targetState = !selectedCardIds.has(id);

                    for (let i = min; i <= max; i++) {
                        const curId = activeIds[i];
                        if (targetState) selectedCardIds.add(curId);
                        else selectedCardIds.delete(curId);
                    }
                }
            } else {
                if (selectedCardIds.has(id)) selectedCardIds.delete(id);
                else selectedCardIds.add(id);
            }

            lastSelectedId = id;
            updateSelectionUI();
        } else {
            openImageViewer(id);
        }
    }

        pressTimer = window.setTimeout(() => {

    function distributeMasterAi() {
        const masterVal = document.getElementById("masterAiImport").value.trim();
        selectedFilesQueue.forEach(qItem => {
            const ta = document.getElementById(`ai-${qItem.id}`);
            if (ta) ta.value = "";
        });

        if (!masterVal) return;
        const photoLinesMap = {};
        selectedFilesQueue.forEach((_, idx) => { photoLinesMap[idx + 1] = []; });

        const lines = masterVal.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        lines.forEach(line => {
            const match = line.match(/^(?:\[?\s*照片|Page|Img|圖)?\s*(\d+)\s*\]?[:：\s,，\.]*(.*)$/i);
            if (match) {
                const photoNum = parseInt(match[1], 10);
                const cleanLine = match[2].trim();
                if (photoLinesMap[photoNum]) photoLinesMap[photoNum].push(cleanLine);
            }
        });

        selectedFilesQueue.forEach((qItem, idx) => {
            const ta = document.getElementById(`ai-${qItem.id}`);
            if (ta && photoLinesMap[idx + 1]) ta.value = photoLinesMap[idx + 1].join('\n');
        });
    }

    function compressImage(file, maxSize = 1000, quality = 0.7) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    let width = img.width; let height = img.height;
                    if (width > height) {
                        if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                    } else {
                        if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL("image/jpeg", quality));
                };
            };
        });
    }

    /* --- 圖文分離上傳邏輯 --- */
    async function saveAllQuestions() {
        if (selectedFilesQueue.length === 0) return;
        const submitBtn = document.getElementById("submitAllBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "壓縮上傳中...";

        try {
            const batch = db.batch();
            let successCount = 0;
            const baseGroupId = Date.now(); 
            let timeOffset = 0;

            for (let i = 0; i < selectedFilesQueue.length; i++) {
                const qItem = selectedFilesQueue[i];
                const aiText = document.getElementById(`ai-${qItem.id}`).value.trim();
                const manualNote = document.getElementById(`note-${qItem.id}`).value.trim();
                const expFileInput = document.getElementById(`exp-${qItem.id}`);

                if (!aiText) continue; 
                
                const thumbBase64 = await compressImage(qItem.file, 200, 0.4);
                const fullBase64 = await compressImage(qItem.file, 1200, 0.8);
                
                let expBase64 = null;
                if (expFileInput.files && expFileInput.files.length > 0) {
                    expBase64 = await compressImage(expFileInput.files[0], 1200, 0.8);
                }

                const lines = aiText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                lines.forEach(line => {
                    const parts = line.split(/[,，]/);
                    if (parts.length >= 4) {
                        let finalNotes = parts[4] ? parts[4].trim() : "";
                        if (manualNote) finalNotes = finalNotes ? `${manualNote} (${finalNotes})` : manualNote;

                        const docRef = db.collection("questions").doc();
                        const questionMeta = {
                            subject: parts[0].trim(),
                            unit: parts[1].trim(),
                            concept: parts[2].trim(),
                            type: parts[3].trim(),
                            thumbnail: thumbBase64,
                            hasExplanation: !!expBase64,
                            notes: finalNotes,
                            reviewCount: 0,
                            timestamp: baseGroupId + timeOffset,
                            groupId: baseGroupId
                        };
                        batch.set(docRef, questionMeta);

                        const imgDocRef = db.collection("question_images").doc(docRef.id);
                        batch.set(imgDocRef, {
                            image: fullBase64,
                            explanationImage: expBase64
                        });

                        successCount++;
                        timeOffset++; 
                    }
                });
            }

            if (successCount > 0) {
                await batch.commit();
                alert(`上傳成功！處理了 ${successCount} 題。`);
                closeModal(); 
            } else { alert("未偵測到有效格式！"); }
        } catch (err) { alert("上傳失敗：" + err.message); }
        finally { submitBtn.disabled = false; submitBtn.innerText = "全部儲存並上傳"; }
    }

    function processAndRender(items, filterSub, sortOrder) {
        const listContainer = document.getElementById("questionsList");
        listContainer.innerHTML = "";
        filteredSortedItems = items.filter(item => filterSub === "全部" || item.subject === filterSub);

        const groupCounts = {};
        filteredSortedItems.forEach(item => { 
            const gid = item.groupId || item.timestamp;
            groupCounts[gid] = (groupCounts[gid] || 0) + 1; 
        });

        filteredSortedItems.sort((a, b) => {
            if (sortOrder === "newest") return b.timestamp - a.timestamp;
            if (sortOrder === "oldest") return a.timestamp - b.timestamp;
            if (sortOrder === "reviewAsc") return a.reviewCount - b.reviewCount;
            if (sortOrder === "reviewDesc") return b.reviewCount - a.reviewCount;
            return 0;
        });

        filteredSortedItems.forEach(item => {
            const dateStr = new Date(item.timestamp).toLocaleDateString('zh-TW');
            const hasNotes = item.notes && item.notes.trim().length > 0;
            const hasExplanation = item.hasExplanation || (item.explanationImage && item.explanationImage.trim().length > 0);
            const displayImgSrc = item.thumbnail || item.image || "";

            const card = document.createElement("div");
            card.className = "question-card";
            card.setAttribute("data-id", item.id);
            
            card.addEventListener("click", (e) => handleCardClick(e, item.id));
            card.addEventListener("touchstart", () => handleTouchStart(item.id), { passive: true });
            card.addEventListener("touchend", handleTouchCancel, { passive: true });
            card.addEventListener("touchmove", handleTouchCancel, { passive: true });

            card.innerHTML = `
                <div class="question-img-container">
                    <img class="question-img" src="${displayImgSrc}" alt="錯題縮圖">
                </div>
                <div class="question-details">
                    <div>
                        <div class="card-meta-line">
                            <span class="tag-subject">${item.subject}</span>
                            <span class="meta-gray-text">${item.type}</span>
                            <span class="meta-gray-text">複習 ${item.reviewCount} 次</span>
                            <span class="meta-gray-text" style="margin-left: auto;">${dateStr}</span>
                        </div>
                        <div class="concept-text">
                            <strong>單元：</strong>${item.unit}<br>
                            <strong>觀念：</strong>${item.concept}
                        </div>
                        ${hasNotes ? `<div class="notes-box"><strong>備註：</strong>${item.notes}</div>` : ''}
                        ${hasExplanation ? `
                            <div class="explanation-section">
                                <button class="btn-toggle-exp" id="btn-exp-${item.id}" onclick="toggleExplanation('${item.id}')">查看詳解</button>
                                <div class="explanation-img-box" id="exp-${item.id}"></div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });

        triggerChartRebuilt(filterSub);
        updateSelectionUI();
    }

    function triggerChartRebuilt(filterSub) {
        const items = Object.values(window.currentItemsMap);
        let filteredItems = items.filter(item => filterSub === "全部" || item.subject === filterSub);
        const stats = {};
        if (filterSub === "全部") {
            filteredItems.forEach(item => { stats[item.subject] = (stats[item.subject] || 0) + 1; });
        } else {
            filteredItems.forEach(item => {
                const key = item.concept || "未分類觀念";
                stats[key] = (stats[key] || 0) + 1;
            });
        }
        const sortedStats = Object.entries(stats).sort((a, b) => b[1] - a[1]);
        drawHorizontalBarChart(sortedStats, filterSub);
    }

    function toggleChartExpand() {
        chartExpanded = !chartExpanded;
        const filterSubject = document.getElementById("filterSubject").value;
        triggerChartRebuilt(filterSubject);
    }

    function drawHorizontalBarChart(data, filterSub) {
        const canvas = document.getElementById("weaknessChart");
        const ctx = canvas.getContext("2d");
        const container = document.getElementById("chartContainer");
        const logicalWidth = container.clientWidth || 800; 

        if (data.length === 0) {
            canvas.style.height = "120px";
            canvas.width = logicalWidth * window.devicePixelRatio;
            canvas.height = 120 * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            ctx.clearRect(0, 0, logicalWidth, 120);
            ctx.fillStyle = "#888"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("尚無錯題數據", logicalWidth / 2, 60);
            let toggleBtn = document.getElementById("chartToggleBtn");
            if (toggleBtn) toggleBtn.style.display = "none";
            return;
        }

        let displayData = data;
        const hasMoreThanFive = data.length > 5;
        if (hasMoreThanFive && !chartExpanded) {
            displayData = data.slice(0, 5);
        }

        const rowHeight = 35; 
        const headerHeight = 40;
        const footerHeight = 20;
        const logicalHeight = displayData.length * rowHeight + headerHeight + footerHeight;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = logicalWidth * dpr;
        canvas.height = logicalHeight * dpr;
        canvas.style.width = logicalWidth + "px";
        canvas.style.height = logicalHeight + "px";
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, logicalWidth, logicalHeight);

        const leftMargin = Math.min(150, logicalWidth * 0.35); 
        const rightMargin = 50; 
        const chartWidth = logicalWidth - leftMargin - rightMargin;
        const maxVal = Math.max(...data.map(x => x[1]), 1);

        ctx.fillStyle = "#888888"; ctx.font = "bold 13px sans-serif"; ctx.textAlign = "left";
        ctx.fillText(filterSub === "全部" ? "【跨科目錯題弱點】" : `【${filterSub} - 觀念排行】`, 10, 25);

        displayData.forEach(([label, count], i) => {
            const y = headerHeight + i * rowHeight;
            const barWidth = (count / maxVal) * chartWidth;

            ctx.fillStyle = "#ffffff"; ctx.font = "12px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
            const displayLabel = label.length > 12 ? label.slice(0, 10) + "..." : label;
            ctx.fillText(displayLabel, leftMargin - 15, y + 12);

            ctx.fillStyle = "#222222"; ctx.fillRect(leftMargin, y, chartWidth, 18);
            ctx.fillStyle = "rgba(229, 115, 115, 0.9)"; ctx.fillRect(leftMargin, y, barWidth, 18);
            ctx.fillStyle = "#e57373"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "left";
            ctx.fillText(`${count} 題`, leftMargin + barWidth + 8, y + 10);
        });

        let toggleBtn = document.getElementById("chartToggleBtn");
        if (!toggleBtn) {
            toggleBtn = document.createElement("button");
            toggleBtn.id = "chartToggleBtn";
            toggleBtn.style.cssText = "width:auto; margin:10px auto; padding:6px 20px; background:#262626; color:#bbb; border:1px solid #444; border-radius:20px; cursor:pointer; font-size:12px; display:block;";
            toggleBtn.onclick = toggleChartExpand;
            canvas.parentNode.appendChild(toggleBtn);
        }
        if (hasMoreThanFive) {
            toggleBtn.style.display = "block";
            toggleBtn.innerText = chartExpanded ? "收起排行 🔼" : `查看全部排行 (${data.length}) 🔽`;
        } else {
            toggleBtn.style.display = "none";
        }
    }
</script>

</body>
