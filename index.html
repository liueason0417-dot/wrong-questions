<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測錯題數據庫 (雲端同步版)</title>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #3f51b5;
            --accent-hover: #5c6bc0;
            --border-color: #333333;
            --danger-color: #e57373;
            --success-color: #4caf50;
            --warning-color: #ff9800;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 850px) {
            .grid {
                grid-template-columns: 350px 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            background-color: #2c2c2c;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
        }

        .btn-success { background-color: var(--success-color); margin-top: 5px; }
        .btn-success:hover { background-color: #45a049; }

        .import-box, .prompt-box {
            background-color: #252525;
            border: 1px dashed var(--accent-color);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .prompt-box { border-color: var(--success-color); }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .chart-container {
            text-align: center;
            margin-top: 15px;
        }

        #radarChart {
            max-width: 100%;
            background-color: #1a1a1a;
            border-radius: 6px;
        }

        .questions-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 1100px) {
            .questions-list { grid-template-columns: 1fr 1fr; }
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .question-img-container {
            width: 100%;
            background-color: #000;
            text-align: center;
            position: relative;
        }

        .question-img {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .question-details {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 5px;
        }

        .tag-subject { background-color: #00796b; color: white; }
        .tag-type { background-color: #7b1fa2; color: white; }
        .tag-review { background-color: var(--warning-color); color: #000; }
        .tag-date { background-color: #555555; color: #fff; }

        .concept-text {
            font-size: 14px;
            margin: 8px 0;
            color: #fff;
            line-height: 1.4;
        }

        .notes-box {
            font-size: 13px;
            color: #b0b0b0;
            background-color: #262626;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            border-left: 3px solid var(--accent-color);
            word-break: break-all;
        }

        .explanation-section {
            margin-top: 10px;
            border-top: 1px solid #2a2a2a;
            padding-top: 10px;
        }

        .btn-toggle-exp {
            background-color: #333;
            color: #ddd;
            padding: 6px;
            font-size: 12px;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .btn-toggle-exp:hover {
            background-color: #444;
        }

        .explanation-img-box {
            display: none;
            margin-top: 8px;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn-review {
            background-color: var(--warning-color);
            color: #000;
            padding: 6px 12px;
            margin: 0;
            width: auto;
            font-size: 13px;
        }

        .btn-review:hover { background-color: #fb8c00; }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 5px 10px;
            margin: 0;
            font-size: 12px;
            width: auto;
        }

        .delete-btn:hover { background-color: rgba(229, 115, 115, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>學測錯題數據庫 (雲端同步版)</h1>
        <p style="color: #888; margin: 0;">全平台即時同步 · 自動生成專屬 AI 提示詞 · 支援一圖多拆與摺疊詳解</p>
    </header>

    <div class="grid">
        <div>
            <div class="card prompt-box">
                <h3 style="margin-top: 0; color: var(--success-color);">1. 獲取專屬 AI 指令</h3>
                <textarea id="aiPromptText" rows="4" readonly style="font-size: 12px; color: #888; background: #1a1a1a;"></textarea>
                <button class="btn-success" onclick="copyPrompt()">一鍵複製指令</button>
            </div>

            <div class="card">
                <h3 style="margin-top: 0;">2. 匯入與新增錯題</h3>
                
                <div class="import-box">
                    <label style="margin-top:0;">AI 解析結果快速帶入 (可多行自動拆分)</label>
                    <textarea id="aiImport" rows="3" placeholder="單行例: 國文,現代新詩,語境推敲,單選題&#10;多行會自動拆分：&#10;英文,綜合測驗-第2題,主謂一致,單選題&#10;英文,綜合測驗-第5題,動詞搭配,單選題" oninput="quickImport()"></textarea>
                </div>

                <form id="wrongQuestionForm" onsubmit="saveQuestion(event)">
                    <label>選擇題目照片 (必填)</label>
                    <input type="file" id="photoInput" accept="image/*">

                    <label>選擇詳解照片 (選填)</label>
                    <input type="file" id="explanationPhotoInput" accept="image/*">

                    <label>備註 / 記筆記 (選填)</label>
                    <input type="text" id="notes" placeholder="例如：寫在講義第 12 頁、粗心看錯">

                    <label>科目</label>
                    <select id="subject">
                        <option value="">選擇科目</option>
                        <option value="國文">國文</option>
                        <option value="英文">英文</option>
                        <option value="數學">數學</option>
                        <option value="物理">物理</option>
                        <option value="化學">化學</option>
                        <option value="生物">生物</option>
                        <option value="地科">地科</option>
                        <option value="歷史">歷史</option>
                        <option value="地理">地理</option>
                        <option value="公民">公民</option>
                    </select>

                    <label>單元</label>
                    <input type="text" id="unit" placeholder="例如：現代新詩">

                    <label>核心觀念</label>
                    <input type="text" id="concept" placeholder="例如：詩意語境推敲">

                    <label>題型</label>
                    <select id="type">
                        <option value="單選題">單選題</option>
                        <option value="多選題">多選題</option>
                        <option value="非選擇題">非選擇題</option>
                    </select>

                    <button type="submit" id="submitBtn">儲存此錯題</button>
                </form>
            </div>
        </div>

        <div>
            <div class="card">
                <h3 style="margin-top: 0;">3. 數據篩選 & 弱點分析</h3>
                <div class="filter-group">
                    <select id="filterSubject" onchange="loadQuestions()">
                        <option value="全部">全部科目 (查看弱點)</option>
                        <option value="國文">國文</option>
                        <option value="英文">英文</option>
                        <option value="數學">數學</option>
                        <option value="物理">物理</option>
                        <option value="化學">化學</option>
                        <option value="生物">生物</option>
                        <option value="地科">地科</option>
                        <option value="歷史">歷史</option>
                        <option value="地理">地理</option>
                        <option value="公民">公民</option>
                    </select>
                    <select id="sortOrder" onchange="loadQuestions()">
                        <option value="newest">最新加入優先</option>
                        <option value="oldest">最舊加入優先</option>
                        <option value="reviewAsc">複習次數：少到多 (找弱點)</option>
                        <option value="reviewDesc">複習次數：多到少</option>
                    </select>
                </div>
                
                <div class="chart-container">
                    <canvas id="radarChart" width="400" height="300"></canvas>
                </div>
            </div>

            <div class="questions-list" id="questionsList"></div>
        </div>
    </div>
</div>

<script>
    // 你的 Firebase Config 帳號資訊
    const firebaseConfig = {
        apiKey: "AIzaSyA5xWtkaPt0_5doRo55WLIbBroI22ypkZ8",
        authDomain: "ai-vocab-coach.firebaseapp.com",
        projectId: "ai-vocab-coach",
        storageBucket: "ai-vocab-coach.firebasestorage.app",
        messagingSenderId: "550257355969",
        appId: "1:550257355969:web:79e07e09c977e861163840"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 監聽並自動載入雲端資料
    let unsubscribe = null;
    function loadQuestions() {
        if (unsubscribe) unsubscribe();

        const filterSubject = document.getElementById("filterSubject").value;
        const sortOrder = document.getElementById("sortOrder").value;

        unsubscribe = db.collection("questions").onSnapshot((snapshot) => {
            const allItems = [];
            snapshot.forEach(doc => {
                const item = doc.data();
                item.id = doc.id;
                if (typeof item.reviewCount === 'undefined') item.reviewCount = 0;
                allItems.push(item);
            });
            updateAIPrompt(allItems);
            processAndRender(allItems, filterSubject, sortOrder);
        }, (error) => {
            console.error("雲端讀取失敗:", error);
        });
    }

    window.onload = function() {
        loadQuestions();
    };

    // 處理剪貼簿匯入，相容中英文逗號
    function quickImport() {
        const val = document.getElementById("aiImport").value.trim();
        if (!val) return;
        
        const lines = val.split('\n').filter(l => l.trim().length > 0);
        if (lines.length === 1) {
            const parts = lines[0].split(/[,，]/);
            if (parts.length >= 4) {
                document.getElementById("subject").value = parts[0].trim();
                document.getElementById("unit").value = parts[1].trim();
                document.getElementById("concept").value = parts[2].trim();
                document.getElementById("type").value = parts[3].trim();
            }
        }
    }

    // 圖片前置壓縮處理 (限制最大寬高 1000px，品質 0.7)
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const max_size = 1000; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    resolve(dataUrl);
                };
            };
        });
    }

    // 儲存或批次拆分錯題到 Firestore
    async function saveQuestion(e) {
        e.preventDefault();
        const submitBtn = document.getElementById("submitBtn");
        const fileInput = document.getElementById("photoInput");
        const expFileInput = document.getElementById("explanationPhotoInput");

        if (!fileInput.files || fileInput.files.length === 0) {
            alert("請選擇題目圖片！");
            return;
        }

        const importVal = document.getElementById("aiImport").value.trim();
        const lines = importVal.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        // 如果是單題手動模式，驗證表單是否填寫
        if (lines.length <= 1) {
            const subject = document.getElementById("subject").value;
            const unit = document.getElementById("unit").value;
            const concept = document.getElementById("concept").value;
            const type = document.getElementById("type").value;
            if (!subject || !unit || !concept || !type) {
                alert("請填寫完整的科目、單元、核心觀念與題型！");
                return;
            }
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "正在壓縮並上傳雲端...";

        try {
            // 壓縮題目照片
            const file = fileInput.files[0];
            const compressedBase64 = await compressImage(file);

            // 壓縮詳解照片 (選填)
            let expBase64 = null;
            if (expFileInput.files && expFileInput.files.length > 0) {
                expBase64 = await compressImage(expFileInput.files[0]);
            }

            const notesText = document.getElementById("notes").value.trim();

            // 批次寫入 Firestore 
            const batch = db.batch();
            
            if (lines.length > 1) {
                let successCount = 0;
                lines.forEach(line => {
                    const parts = line.split(/[,，]/);
                    if (parts.length >= 4) {
                        const question = {
                            subject: parts[0].trim(),
                            unit: parts[1].trim(),
                            concept: parts[2].trim(),
                            type: parts[3].trim(),
                            image: compressedBase64, // 共用同一張壓縮後的題目照片
                            explanationImage: expBase64, // 共用同張詳解
                            notes: notesText,
                            reviewCount: 0,
                            timestamp: Date.now()
                        };
                        const docRef = db.collection("questions").doc();
                        batch.set(docRef, question);
                        successCount++;
                    }
                });
                
                if (successCount > 0) {
                    await batch.commit();
                    alert(`成功一鍵拆分，匯入 ${successCount} 題錯題！`);
                } else {
                    throw new Error("匯入內容格式不符。");
                }
            } else {
                // 單題模式
                const question = {
                    subject: document.getElementById("subject").value,
                    unit: document.getElementById("unit").value,
                    concept: document.getElementById("concept").value,
                    type: document.getElementById("type").value,
                    image: compressedBase64,
                    explanationImage: expBase64,
                    notes: notesText,
                    reviewCount: 0,
                    timestamp: Date.now()
                };
                await db.collection("questions").add(question);
                alert("雲端儲存成功！");
            }

            document.getElementById("wrongQuestionForm").reset();
            document.getElementById("aiImport").value = "";
        } catch (err) {
            alert("上傳失敗：" + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "儲存此錯題";
        }
    }

    // 複習次數 +1 (Firestore 更新)
    async function incrementReview(id) {
        try {
            const docRef = db.collection("questions").doc(id);
            const doc = await docRef.get();
            const currentCount = doc.data().reviewCount || 0;
            await docRef.update({ reviewCount: currentCount + 1 });
        } catch (err) {
            console.error("更新複習次數失敗:", err);
        }
    }

    // 刪除錯題
    async function deleteQuestion(id) {
        if (!confirm("確定要刪除這筆錯題嗎？刪除後無法恢復。")) return;
        try {
            await db.collection("questions").doc(id).delete();
        } catch (err) {
            alert("刪除失敗：" + err.message);
        }
    }

    // 摺疊/展開詳解控制
    window.toggleExplanation = function(id) {
        const box = document.getElementById(`exp-${id}`);
        const btn = document.getElementById(`btn-exp-${id}`);
        if (box.style.display === "none" || box.style.display === "") {
            box.style.display = "block";
            btn.innerText = "隱藏詳解";
        } else {
            box.style.display = "none";
            btn.innerText = "查看詳解";
        }
    }

    // 動態產生專屬 AI 提示詞
    function updateAIPrompt(items) {
        const unitSet = new Set();
        items.forEach(item => {
            if (item.unit) unitSet.add(item.unit);
        });
        
        let unitString = Array.from(unitSet).join("、");
        if (!unitString) unitString = "目前無既有單元，請依題目自行判斷";

        const promptTemplate = `這是一張考題照片。裡面可能包含單一題目或一整組題目（例如綜合測驗、題組）。
請幫我分析這張照片中「我寫錯或有手寫標記」的所有題目。

請針對「每一道題」單獨輸出一行，格式如下（用半形逗號隔開），絕對不要有任何額外解釋、題號符號、引言或 markdown 標籤：

科目,單元名稱-第X題,核心觀念,題型

【範例輸出】
英文,綜合測驗-第2題,主謂一致(the number of),單選題
英文,綜合測驗-第5題,動詞搭配(exercise talents),單選題

【分類限制規範（請優先從以下既有清單中選擇，若完全不符合再幫我建立新的）】
* 科目：[國文, 英文, 數學, 物理, 化學, 生物, 地科, 歷史, 地理, 公民]
* 單元名稱（既有）：[ ${unitString} ]
* 題型：[單選題, 多選題, 非選擇題]`;

        document.getElementById("aiPromptText").value = promptTemplate;
    }

    // 複製提示詞
    function copyPrompt() {
        const textToCopy = document.getElementById("aiPromptText").value;
        navigator.clipboard.writeText(textToCopy).then(() => {
            alert("指令已複製！請直接貼給 AI 進行分析。");
        }).catch(err => {
            alert("複製失敗，請手動框選複製。");
        });
    }

    // 渲染卡片與繪製圖表
    function processAndRender(items, filterSub, sortOrder) {
        const listContainer = document.getElementById("questionsList");
        listContainer.innerHTML = "";
        
        let filteredItems = items.filter(item => filterSub === "全部" || item.subject === filterSub);

        filteredItems.sort((a, b) => {
            if (sortOrder === "newest") return b.timestamp - a.timestamp;
            if (sortOrder === "oldest") return a.timestamp - b.timestamp;
            if (sortOrder === "reviewAsc") return a.reviewCount - b.reviewCount;
            if (sortOrder === "reviewDesc") return b.reviewCount - a.reviewCount;
            return 0;
        });

        filteredItems.forEach(item => {
            const dateStr = new Date(item.timestamp).toLocaleDateString('zh-TW');
            const hasNotes = item.notes && item.notes.trim().length > 0;
            const hasExplanation = item.explanationImage && item.explanationImage.trim().length > 0;

            const card = document.createElement("div");
            card.className = "question-card";
            card.innerHTML = `
                <div class="question-img-container">
                    <img class="question-img" src="${item.image}" alt="錯題">
                </div>
                <div class="question-details">
                    <div>
                        <span class="tag tag-subject">${item.subject}</span>
                        <span class="tag tag-type">${item.type}</span>
                        <span class="tag tag-review">複習 ${item.reviewCount} 次</span>
                        <span class="tag tag-date">${dateStr}</span>
                        
                        <div class="concept-text">
                            <strong>單元：</strong>${item.unit}<br>
                            <strong>觀念：</strong>${item.concept}
                        </div>

                        ${hasNotes ? `<div class="notes-box"><strong>備註：</strong>${item.notes}</div>` : ''}

                        ${hasExplanation ? `
                            <div class="explanation-section">
                                <button class="btn-toggle-exp" id="btn-exp-${item.id}" onclick="toggleExplanation('${item.id}')">查看詳解</button>
                                <div class="explanation-img-box" id="exp-${item.id}">
                                    <img class="question-img" src="${item.explanationImage}" alt="詳解">
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    <div class="card-actions">
                        <button class="btn-review" onclick="incrementReview('${item.id}')">已複習 +1</button>
                        <button class="delete-btn" onclick="deleteQuestion('${item.id}')">刪除此題</button>
                    </div>
                </div>
            `;
            listContainer.appendChild(card);
        });

        const stats = {};
        if (filterSub === "全部") {
            items.forEach(item => {
                stats[item.subject] = (stats[item.subject] || 0) + 1;
            });
        } else {
            filteredItems.forEach(item => {
                const key = item.unit || "未指定";
                stats[key] = (stats[key] || 0) + 1;
            });
        }

        const sortedStats = Object.entries(stats)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 5);

        const labels = sortedStats.map(x => x[0]);
        const values = sortedStats.map(x => x[1]);

        drawRadarChart(labels, values, filterSub);
    }

    // 離線雷達圖繪製 (Canvas)
    function drawRadarChart(labels, values, filterSub) {
        const canvas = document.getElementById("radarChart");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2 + 10;
        const r = 100; 
        const N = labels.length;

        if (N < 3) {
            ctx.fillStyle = "#888";
            ctx.font = "13px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("累積至少 3 個不同類別的數據後", cx, cy - 10);
            ctx.fillText("將自動繪製弱點雷達圖", cx, cy + 10);
            return;
        }

        const maxValue = Math.max(...values, 1);

        ctx.strokeStyle = "#333333";
        ctx.lineWidth = 1;
        for (let j = 1; j <= 4; j++) {
            const scale = j / 4;
            ctx.beginPath();
            for (let i = 0; i < N; i++) {
                const angle = i * (2 * Math.PI / N) - Math.PI / 2;
                const x = cx + r * scale * Math.cos(angle);
                const y = cy + r * scale * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.stroke();
        }

        ctx.strokeStyle = "#444444";
        for (let i = 0; i < N; i++) {
            const angle = i * (2 * Math.PI / N) - Math.PI / 2;
            const x = cx + r * Math.cos(angle);
            const y = cy + r * Math.sin(angle);

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(x, y);
            ctx.stroke();

            const labelX = cx + (r + 20) * Math.cos(angle);
            const labelY = cy + (r + 15) * Math.sin(angle);
            ctx.fillStyle = "#ffffff";
            ctx.font = "12px sans-serif";
            ctx.textAlign = Math.cos(angle) > 0.1 ? "left" : (Math.cos(angle) < -0.1 ? "right" : "center");
            ctx.textBaseline = "middle";
            ctx.fillText(`${labels[i]} (${values[i]}題)`, labelX, labelY);
        }

        ctx.strokeStyle = "rgba(229, 115, 115, 0.8)";
        ctx.fillStyle = "rgba(229, 115, 115, 0.25)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
            const angle = i * (2 * Math.PI / N) - Math.PI / 2;
            const valScale = values[i] / maxValue;
            const x = cx + r * valScale * Math.cos(angle);
            const y = cy + r * valScale * Math.sin(angle);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#888888";
        ctx.font = "12px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(filterSub === "全部" ? "【跨科目弱點分析 (Top 5)】" : `【${filterSub} - 單元弱點分析 (Top 5)】`, 10, 10);
    }
</script>
