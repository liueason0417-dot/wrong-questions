    }

    // 統一的 Queue Item 產生器 (支援純文字與圖片)
    function addQueueItem(meta = "", qText = "", expText = "", file = null) {
        const queueId = Date.now() + Math.floor(Math.random() * 1000);
        const itemDiv = document.createElement("div"); 
        itemDiv.className = "queue-item"; 
        itemDiv.id = `queue-${queueId}`;
        
        let filePreviewHtml = '';
        if (file) {
            const previewUrl = URL.createObjectURL(file);
            filePreviewHtml = `<img src="${previewUrl}" class="queue-img-preview" alt="預覽圖">`;
            selectedFilesQueue.push({ id: queueId, file: file });
        } else {
            filePreviewHtml = `<div style="height:150px; background:#0f172a; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#64748b; font-size:12px; border: 1px solid var(--border-color);">無題目圖片</div>`;
            selectedFilesQueue.push({ id: queueId, file: null }); 
        }

        itemDiv.innerHTML = `
            <div class="queue-img-wrap">
                ${filePreviewHtml}
                <label style="font-size:13px; margin-top:8px; display:block; text-align:center; color:var(--accent-color); cursor:pointer; font-weight:bold;">
                    <span id="qImgText-${queueId}">📁 附加/更換題目圖 (可多選)</span>
                    <input type="file" id="qImg-${queueId}" accept="image/*" multiple style="display:none;" onchange="updateQueuePreview(this, ${queueId}, false)">
                </label>
                <label style="font-size:13px; margin-top:4px; display:block; text-align:center; color:var(--success-color); cursor:pointer; font-weight:bold;">
                    <span id="expImgText-${queueId}">📁 附加詳解圖 (可多選)</span>
                    <input type="file" id="expImg-${queueId}" accept="image/*" multiple style="display:none;" onchange="updateQueuePreview(this, ${queueId}, true)">
                </label>
            </div>
            <div class="queue-inputs">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <input type="text" id="meta-${queueId}" placeholder="分類：科目,單元,觀念,題型,備註" value="${meta}" style="flex: 1; margin-right: 10px;">
                    <label style="display:flex; align-items:center; gap:5px; color:var(--warning-color); font-weight:bold; font-size:13px; cursor:pointer; white-space: nowrap;">
                        <input type="checkbox" id="isFormula-${queueId}"> 🌟 設為公式
                    </label>
                </div>
                <textarea id="qText-${queueId}" rows="4" placeholder="純文字題目 (支援 Markdown 與 LaTeX，選填)">${qText}</textarea>
                <textarea id="expText-${queueId}" rows="3" placeholder="純文字詳解 (支援 Markdown 與 LaTeX，選填)">${expText}</textarea>
                <button class="btn-nav btn-secondary" style="align-self:flex-end; margin-top:5px; color:var(--danger-color); border:1px solid var(--danger-color);" onclick="removeQueueItem(${queueId})">移除</button>
            </div>
        `;
        document.getElementById("queueContainer").appendChild(itemDiv);
        document.getElementById("submitAllBtn").style.display = "flex";
    }

    // --- 核心功能：多張圖片自動拼接成垂直長圖 ---
    async function stitchImages(files) {
        const sortedFiles = Array.from(files).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
        
        const images = await Promise.all(sortedFiles.map(file => {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }));

        const maxWidth = Math.max(...images.map(img => img.width));
        const totalHeight = images.reduce((sum, img) => sum + img.height, 0);

        const canvas = document.createElement('canvas');
        canvas.width = maxWidth;
        canvas.height = totalHeight;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        let currentY = 0;
        for (const img of images) {
            const x = (maxWidth - img.width) / 2; 
            ctx.drawImage(img, x, currentY);
            currentY += img.height;
            URL.revokeObjectURL(img.src); 
        }

        return new Promise(resolve => {
            canvas.toBlob(blob => {
                resolve(new File([blob], "stitched.jpg", { type: "image/jpeg" }));
            }, 'image/jpeg', 0.9);
        });
    }

    // 更新預覽圖 (支援多選拼接)
    window.updateQueuePreview = async function(input, id, isExp = false) {
        if (!input.files || input.files.length === 0) return;
        
        let finalFile = input.files[0];
        const textSpan = document.getElementById(isExp ? `expImgText-${id}` : `qImgText-${id}`);
        
        if (input.files.length > 1) {
            textSpan.innerText = "⏳ 圖片拼接中...";
            finalFile = await stitchImages(input.files);
            input.stitchedFile = finalFile; 
        } else {
            input.stitchedFile = null;
        }

        if (!isExp) {
            const url = URL.createObjectURL(finalFile);
            const wrap = document.getElementById(`queue-${id}`).querySelector('.queue-img-wrap');
            const oldPreview = wrap.querySelector('.queue-img-preview') || wrap.querySelector('div');
            
            const newImg = document.createElement('img');
            newImg.src = url;
            newImg.className = 'queue-img-preview';
            newImg.alt = '預覽圖';
            
            wrap.replaceChild(newImg, oldPreview);
            
            const qItem = selectedFilesQueue.find(item => item.id === id);
            if (qItem) qItem.file = finalFile;
            
            textSpan.innerText = `✅ 題目圖已更新 (${input.files.length}張)`;
        } else {
            textSpan.innerText = `✅ 詳解圖已附加 (${input.files.length}張)`;
        }
    }

    // 處理手動選擇照片
    function handleFilesSelect(e) {
        const files = Array.from(e.target.files); if (files.length === 0) return;
        files.forEach((file) => {
            addQueueItem("", "", "", file);
        });
        e.target.value = ""; 
    }

    // 處理 AI 智能解析
    window.parseSmartImport = function() {
        const text = document.getElementById('masterAiImport').value;
        if (!text.trim()) {
            alert("請先貼上 AI 的解析結果！");
            return;
        }
        
        const blocks = text.split(/\[(?:錯題|照片)\s*\d*\]/i).filter(b => b.trim().length > 0);
        
        if (blocks.length === 0) {
            addQueueItem("", text, "");
            return;
        }

        blocks.forEach((block) => {
            let meta = "", qText = "", expText = "";
            
            const metaMatch = block.match(/分類[：:]\s*(.*)/);
            if (metaMatch) meta = metaMatch[1].trim();
            
            const qMatch = block.match(/題目[：:]([\s\S]*?)(?=詳解[：:]|$)/);
            if (qMatch) qText = qMatch[1].trim();
            
            const expMatch = block.match(/詳解[：:]([\s\S]*)/);
            if (expMatch) expText = expMatch[1].trim();
            
            if (qText.includes("(留白)")) qText = "";
            if (expText.includes("(留白)")) expText = "";

            addQueueItem(meta, qText, expText, null);
        });
        
        document.getElementById('masterAiImport').value = ""; 
    }

    function removeQueueItem(id) {
        document.getElementById(`queue-${id}`).remove(); 
        selectedFilesQueue = selectedFilesQueue.filter(item => item.id !== id);
        if (selectedFilesQueue.length === 0) { 
            document.getElementById("submitAllBtn").style.display = "none"; 
        } 
    }

    async function saveAllQuestions() {
        if (selectedFilesQueue.length === 0) return;
        const submitBtn = document.getElementById("submitAllBtn"); submitBtn.disabled = true; submitBtn.innerText = "⏳ 儲存上傳中...";
        try {
            const batch = db.batch(); let successCount = 0; const baseGroupId = Date.now(); let timeOffset = 0;
            
            for (let i = 0; i < selectedFilesQueue.length; i++) {
                const qItem = selectedFilesQueue[i];
                const metaText = document.getElementById(`meta-${qItem.id}`).value.trim();
                const qText = document.getElementById(`qText-${qItem.id}`).value.trim();
                const expText = document.getElementById(`expText-${qItem.id}`).value.trim();
                const isFormula = document.getElementById(`isFormula-${qItem.id}`).checked; 
                
                const qImgInput = document.getElementById(`qImg-${qItem.id}`);
                const expImgInput = document.getElementById(`expImg-${qItem.id}`);
                
                let finalQFile = qImgInput.stitchedFile || (qImgInput.files.length > 0 ? qImgInput.files[0] : qItem.file);
                let finalExpFile = expImgInput.stitchedFile || (expImgInput.files.length > 0 ? expImgInput.files[0] : null);

                // 🌟 核心修改：不再把文字跟圖片黏在一起，而是單純壓縮圖片
                let fullBase64 = await compressImage(finalQFile);
                if (!qText && !fullBase64) continue; // 如果沒文字也沒圖片就跳過
                
                let thumbBase64 = "";
                if (fullBase64) {
                    const img = new Image();
                    img.src = fullBase64;
                    await new Promise(r => img.onload = r);
                    const thumbCanvas = document.createElement('canvas');
                    thumbCanvas.width = 300;
                    thumbCanvas.height = img.height * (300 / img.width);
                    thumbCanvas.getContext('2d').drawImage(img, 0, 0, thumbCanvas.width, thumbCanvas.height);
                    thumbBase64 = thumbCanvas.toDataURL('image/jpeg', 0.5);
                }
                
                let expBase64 = await compressImage(finalExpFile);

                const parts = metaText.split(/[,，]/).map(p => p.trim());
                const subject = parts[0] || "未分類";
                const unit = parts[1] || "";
                const concept = parts[2] || "";
                const type = parts[3] || "";
                const notes = parts[4] || "";

                const docRef = db.collection("questions").doc();
                const questionMeta = {
                    subject, unit, concept, type, notes,
                    questionText: qText, 
                    explanationText: expText,
                    thumbnail: thumbBase64, 
                    hasExplanation: !!expBase64 || !!expText, 
                    isFormula: isFormula, 
                    isRawImage: true, // 🌟 新增標記：代表這是新版「文字與圖片分離」的資料
                    reviewCount: 0, tags: [], timestamp: baseGroupId + timeOffset, groupId: baseGroupId
                };
                batch.set(docRef, questionMeta);
                const imgDocRef = db.collection("question_images").doc(docRef.id);
                batch.set(imgDocRef, { image: fullBase64, explanationImage: expBase64, annotationImage: "" });
                successCount++; timeOffset++; 
            }
            
            if (successCount > 0) { await batch.commit(); alert(`上傳成功！處理了 ${successCount} 題。`); closeModal(); } 
            else { alert("沒有可上傳的有效題目！"); }
        } catch (err) { alert("上傳失敗：" + err.message); }
        finally { submitBtn.disabled = false; submitBtn.innerText = "全部儲存並上傳"; }
    }

    // --- 雙指令切換邏輯 ---
    window.switchPromptMode = function(mode) {
        currentPromptMode = mode;
        const btnText = document.getElementById("btnPromptText");
        const btnImg = document.getElementById("btnPromptImg");
        const desc = document.getElementById("promptDesc");
        const textarea = document.getElementById("aiPromptText");

        if (mode === 'text') {
            btnText.className = "btn-nav btn-primary";
            btnImg.className = "btn-nav btn-secondary";
            desc.innerText = "💡 適合國、英、史、地等，AI 會幫你打出完整題目文字。";
            textarea.value = promptTextMode;
        } else {
            btnText.className = "btn-nav btn-secondary";
            btnImg.className = "btn-nav btn-primary";
            desc.innerText = "💡 適合數、物、化或圖表題，AI 不會打題目，保留畫面乾淨讓你傳原圖。";
            textarea.value = promptImageMode;
        }
    }

    function updateAIPrompt(items) {
        const unitSet = new Set(); const conceptSet = new Set();
        items.forEach(item => { if (item.unit) unitSet.add(item.unit); if (item.concept) conceptSet.add(item.concept); });
        let unitString = Array.from(unitSet).join("、") || "無既有單元"; let conceptString = Array.from(conceptSet).join("、") || "無既有觀念";
        
        const mathRule = `
【⚠️ 數學語法嚴格要求 (極度重要)】
只要句子中出現「任何」數字、變數、算式或數學符號（例如階乘、排列組合 P/C、分數），請「絕對」要使用 LaTeX 語法，並用 $ 包起來！
❌ 錯誤示範：有 3! = 6 種方法，P^6_4 = 360。
✅ 正確示範：有 $3! = 6$ 種方法，$P^6_4 = 360$。
獨立成行的長算式請用 $$ 包起來。
* 為了方便我複製，請務必將最終結果放在「程式碼區塊 (Code Block)」中輸出。`;

        promptTextMode = `請幫我將照片中的「錯題」進行結構化整理。
請針對每一題，嚴格使用以下格式輸出（不要加上額外的引言或 Markdown 程式碼區塊符號）：

[錯題]
分類：科目,單元名稱,核心觀念,題型,題號備註
題目：
(請完整打出題目與選項文字，如果是閱讀測驗請包含文章。請用 Markdown 排版)
詳解：
(請用 Markdown 排版寫出詳解。若照片無詳解請自行提供完整計算過程與最終答案)

【限制清單】
* 欄位 1 (科目)：[國文, 英文, 數學, 物理, 化學, 生物, 地科, 歷史, 地理, 公民]
* 欄位 2 (單元名稱)：優先使用既有單元 -> [ ${unitString} ]
* 欄位 3 (核心觀念)：優先使用既有觀念 -> [ ${conceptString} ]
* 欄位 4 (題型)：[單選題, 多選題, 非選擇題, 題組]
* 欄位 5 (題號備註)：寫「第X題」。
${mathRule}`;

        promptImageMode = `請幫我將照片中的「錯題」進行結構化整理。
請注意：這題包含複雜圖表或數學符號，**請「不要」幫我打出題目與詳解的文字**（這兩個欄位請直接留白）。你只需要判斷分類標籤即可。
請嚴格使用以下格式輸出（不要加上額外的引言或 Markdown 程式碼區塊符號）：

[錯題]
分類：科目,單元名稱,核心觀念,題型,題號備註
題目：
(留白)
詳解：
(留白)

【限制清單】
* 欄位 1 (科目)：[國文, 英文, 數學, 物理, 化學, 生物, 地科, 歷史, 地理, 公民]
* 欄位 2 (單元名稱)：優先使用既有單元 -> [ ${unitString} ]
* 欄位 3 (核心觀念)：優先使用既有觀念 -> [ ${conceptString} ]
* 欄位 4 (題型)：[單選題, 多選題, 非選擇題, 題組]
* 欄位 5 (題號備註)：寫「第X題」。
${mathRule}`;

        switchPromptMode(currentPromptMode);
    }
